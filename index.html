// ─── Google Calendar Integration ─────────────────────────────────────────────
var GC_CLIENT_ID = '55780604748-7jmsl2q0l3mpdd3n37l5s5jorv2og780.apps.googleusercontent.com';
var GC_SCOPE = 'https://www.googleapis.com/auth/calendar.events';
var gcTokenClient = null;

function initGoogleCalendar(){
  if(typeof google === 'undefined' || !google.accounts) return;
  gcTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GC_CLIENT_ID,
    scope: GC_SCOPE,
    callback: function(resp){
      if(resp.error){ flash('Google sign-in failed: '+resp.error,'err'); return; }
      S.gcalToken = resp.access_token;
      // Get user info
      fetch('https://www.googleapis.com/oauth2/v3/userinfo',{
        headers:{ Authorization: 'Bearer '+resp.access_token }
      }).then(function(r){return r.json();}).then(function(info){
        S.gcalUser = info.name || info.email || 'Google User';
        flash('Connected to Google Calendar as '+S.gcalUser+'!');
        render();
      });
    }
  });
}

function connectGoogleCalendar(){
  if(!gcTokenClient){ initGoogleCalendar(); }
  if(gcTokenClient){ gcTokenClient.requestAccessToken(); }
  else { flash('Google Calendar not ready yet. Try again in a moment.','err'); }
}

function disconnectGoogleCalendar(){
  if(S.gcalToken) google.accounts.oauth2.revoke(S.gcalToken, function(){});
  S.gcalToken = null; S.gcalUser = null;
  flash('Disconnected from Google Calendar.');
  render();
}

function addToGoogleCalendar(act, lead){
  if(!S.gcalToken){ flash('Please connect Google Calendar first.','err'); return; }
  var startDT = act.date && act.time ? act.date+'T'+act.time+':00' : new Date().toISOString().slice(0,19);
  var endDT   = act.date && act.time ? act.date+'T'+(function(){
    var [h,m]=act.time.split(':').map(Number); h+=1; return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  }())+':00' : new Date(Date.now()+3600000).toISOString().slice(0,19);

  var event = {
    summary: act.type + (lead ? ' — ' + (lead.bizName||lead.ownerContact||'Lead') : ''),
    description: [
      act.note ? 'Notes: '+act.note : '',
      lead ? 'Business: '+(lead.bizName||'') : '',
      lead ? 'Contact: '+(lead.ownerContact||'') : '',
      lead ? 'Phone: '+(lead.phone||'') : '',
      lead ? 'Lead ID: '+(lead.leadId||'') : '',
      'Logged via African Aspirations CRM'
    ].filter(Boolean).join('\n'),
    start: { dateTime: startDT, timeZone: 'Africa/Accra' },
    end:   { dateTime: endDT,   timeZone: 'Africa/Accra' },
    reminders: { useDefault: true }
  };

  fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
    method: 'POST',
    headers: { Authorization: 'Bearer '+S.gcalToken, 'Content-Type': 'application/json' },
    body: JSON.stringify(event)
  }).then(function(r){
    if(r.ok){ flash('Event added to Google Calendar! &#128197;'); }
    else { r.json().then(function(e){ flash('Calendar error: '+(e.error&&e.error.message||'Unknown'),'err'); }); }
  }).catch(function(){ flash('Could not connect to Google Calendar.','err'); });
}

// ─── Brute Force Protection ──────────────────────────────────────────────────
var MAX_ATTEMPTS = 5;
var LOCKOUT_MS   = 15 * 60 * 1000; // 15 minutes

function isLockedOut(email) {
  var key = email.toLowerCase().trim();
  var entry = S.loginAttempts[key];
  if (!entry) return false;
  if (entry.lockedUntil && Date.now() < entry.lockedUntil) return true;
  // Lock expired — reset
  if (entry.lockedUntil && Date.now() >= entry.lockedUntil) {
    delete S.loginAttempts[key];
  }
  return false;
}

function getLockoutMessage(email) {
  var key = email.toLowerCase().trim();
  var entry = S.loginAttempts[key];
  if (!entry || !entry.lockedUntil) return '';
  var remaining = Math.ceil((entry.lockedUntil - Date.now()) / 60000);
  return 'Account temporarily locked after too many failed attempts. Try again in ' + remaining + ' minute' + (remaining === 1 ? '' : 's') + '.';
}

function recordFailedAttempt(email) {
  var key = email.toLowerCase().trim();
  if (!S.loginAttempts[key]) S.loginAttempts[key] = { count: 0, lockedUntil: null };
  S.loginAttempts[key].count++;
  if (S.loginAttempts[key].count >= MAX_ATTEMPTS) {
    S.loginAttempts[key].lockedUntil = Date.now() + LOCKOUT_MS;
  }
}

function getRemainingAttempts(email) {
  var key = email.toLowerCase().trim();
  var entry = S.loginAttempts[key];
  if (!entry) return MAX_ATTEMPTS;
  return Math.max(0, MAX_ATTEMPTS - entry.count);
}

function clearFailedAttempts(email) {
  delete S.loginAttempts[email.toLowerCase().trim()];
}

// ─── Auto-logout (10 min inactivity) ────────────────────────────────────────
var _autoLogoutTimer=null;
var AUTO_LOGOUT_MS=10*60*1000; // 10 minutes

function resetAutoLogout(){
  if(_autoLogoutTimer) clearTimeout(_autoLogoutTimer);
  if(!S.currentUser) return;
  _autoLogoutTimer=setTimeout(function(){
    if(S.currentUser){
      S.currentUser=null;
      sessionStorage.removeItem('aa_crm_user');
      S.loginError='You were signed out due to 10 minutes of inactivity.';
      render();
    }
  },AUTO_LOGOUT_MS);
}

// Reset timer on any user activity
['click','keydown','mousemove','touchstart','scroll'].forEach(function(evt){
  document.addEventListener(evt,resetAutoLogout,{passive:true});
});

// ─── Password Hashing ────────────────────────────────────────────────────────
async function hashPassword(password){
  var encoder=new TextEncoder();
  var data=encoder.encode(password+'AA_CRM_SALT_2026');
  var hash=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(hash)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

function loadFromSupabase(){
  S.SB_LOADING = true;
  render();
  Promise.all([
    sbLoad('deals'),
    sbLoad('leads'),
    sbLoad('notes'),
    sbLoad('activities'),
    sbLoad('audit_log'),
    sbLoad('clients')
  ]).then(function(results){
    var deals=results[0], leads=results[1], notes=results[2], acts=results[3], audit=results[4], clients=results[5];
    if(Array.isArray(deals)) S.deals = deals.map(function(r){return Object.assign({_id:r.id},r.data);});
    if(Array.isArray(leads)) S.leads = leads.map(function(r){return Object.assign({_id:r.id},r.data);});
    if(Array.isArray(notes)) S.notes = notes.map(function(r){return Object.assign({_id:r.id},r.data);});
    if(Array.isArray(acts)) S.acts = acts.map(function(r){return Object.assign({_id:r.id},r.data);});
    if(Array.isArray(audit)) S.auditLog = audit.map(function(r){return Object.assign({_id:r.id},r.data);});
    if(Array.isArray(clients)) S.clients = clients.map(function(r){return Object.assign({_id:r.id},r.data);});
    // Load deal audit from same table (dealId field distinguishes them)
    S.dealAuditLog = S.auditLog.filter(function(e){return e.dealId;});
    S.auditLog = S.auditLog.filter(function(e){return e.leadId&&!e.dealId;});
    SB_CONNECTED = true; SB_ERROR = '';
    S.SB_LOADING = false;
    loadUsers();
    render();
  }).catch(function(err){
    SB_CONNECTED = false; SB_ERROR = 'Could not connect to database.';
    S.SB_LOADING = false;
    render();
  });
}

function nextLeadId(serviceType){
  // Determine prefix from service type
  var prefix='L';
  if(serviceType==='Business Consulting') prefix='C';
  else if(serviceType==='Business Funding') prefix='F';
  else if(serviceType==='Business Valuation') prefix='V';
  else if(serviceType==='Business Brokerage') prefix='B';
  // Find highest existing number for this prefix
  var max=0;
  S.leads.forEach(function(l){
    var id=l.leadId||'';
    if(id.charAt(0)===prefix){
      var num=parseInt(id.slice(1),10);
      if(!isNaN(num)&&num>max) max=num;
    }
  });
  return prefix+('0000'+(max+1)).slice(-5);
}

function rDash(){
  var totalDeals=S.deals.length;
  var totalLeads=S.leads.length;
  var totalClients=S.clients.length;
  var activeDeals=S.deals.filter(function(d){return d.status==='Active';}).length;
  var pendingLeads=S.leads.filter(function(l){return l.leadStatus==='pending';}).length;
  var hotLeads=S.leads.filter(function(l){return l.label==='Hot';}).length;
  var completedDeals=S.deals.filter(function(d){return d.status==='Completed';}).length;
  var allDlvs=[];S.deals.forEach(function(d){(d.deliverables||[]).forEach(function(dlv){allDlvs.push(dlv);});});
  var avgProg=allDlvs.length?Math.round(allDlvs.reduce(function(a,d){return a+(d.progress||0);},0)/allDlvs.length):0;

  var svcMap={'Business Consulting':'Consulting','Business Brokerage':'Brokerage','Business Funding':'Funding','Business Valuation':'Valuation'};
  var svcCol={'Business Consulting':'#275F45','Business Brokerage':'#D97706','Business Funding':'#7C3AED','Business Valuation':'#0E7490'};

  var html='<div>';

  // Page header
  html+='<div class="page-header">'+
    '<div class="page-header-left">'+
      '<h1>Dashboard</h1>'+
      '<p>Welcome back, '+e(S.currentUser?S.currentUser.name:'')+'</p>'+
    '</div>'+
    '<div class="page-header-actions">'+
      '<button class="btn btn-secondary" data-tab="leads" style="font-size:12px;">+ New Lead</button>'+
      '<button class="btn" data-tab="form" style="font-size:12px;">+ New Deal</button>'+
    '</div>'+
  '</div>';

  // KPI strip
  html+='<div class="kpi-grid">';
  [
    [totalClients,'Total Clients','#275F45','CLI'],
    [totalLeads,'Total Leads','#5F6B65','All'],
    [pendingLeads,'Pending Approval','#D97706','⏳'],
    [activeDeals,'Active Deals','#275F45','🟢'],
    [completedDeals,'Completed Deals','#2E7D32','✓'],
    [avgProg+'%','Avg. Progress','#0E7490','◕'],
  ].forEach(function(k){
    html+='<div class="kpi-card">'+
      '<div class="kpi-value" style="color:'+k[2]+'">'+k[0]+'</div>'+
      '<div class="kpi-label">'+k[1]+'</div>'+
    '</div>';
  });
  html+='</div>';

  // Two column layout
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">';

  // Recent deals
  html+='<div class="tbl-wrap-card">';
  html+='<div class="card-header"><div class="card-header-title">Recent Deals</div><button class="btn btn-ghost btn-sm" data-tab="pipeline">View all</button></div>';
  var recentDeals=[].concat(S.deals).reverse().slice(0,6);
  if(!recentDeals.length){
    html+='<div class="empty" style="padding:32px;"><div class="empty-icon">&#9889;</div><h3>No deals yet</h3><p>Add your first deal to get started</p></div>';
  } else {
    html+='<table><thead><tr><th>Deal ID</th><th>Business</th><th>Service</th><th>Status</th></tr></thead><tbody>';
    recentDeals.forEach(function(d){
      var sc=d.status==='Active'?'badge-success':d.status==='Completed'?'badge-info':d.status==='On Hold'?'badge-warning':'badge-error';

function nextDealId(serviceType){
  var prefix='D';
  if(serviceType==='Business Consulting') prefix='C';
  else if(serviceType==='Business Brokerage') prefix='B';
  else if(serviceType==='Business Funding') prefix='F';
  else if(serviceType==='Business Valuation') prefix='V';
  var max=0;
  S.deals.forEach(function(d){
    var id=d.dealId||'';
    if(id.charAt(0)===prefix){
      var num=parseInt(id.slice(1),10);
      if(!isNaN(num)&&num>max) max=num;
    }
  });
  return prefix+('0000'+(max+1)).slice(-5);
}

    var liveDelivs=(S.deals.filter(function(x){return x._id===S.eid;})[0]||{}).deliverables||[];

    // Track changed fields
    var changedFields=Object.keys(FLD).filter(function(k){return String(f[k]||'')!==String(existing[k]||'')&&k!=='dealStatus';});
    var dealEntries=changedFields.map(function(k){return {_id:'DA'+Date.now()+Math.random(),dealId:updated.dealId,dealRef:S.eid,user:actor,field:FLD[k],prev:String(existing[k]||'n/a'),next:String(f[k]||'n/a'),ts:ts2};});
    if(status!==existing.dealStatus) dealEntries.push({_id:'DA'+Date.now()+Math.random(),dealId:updated.dealId,dealRef:S.eid,user:actor,field:'Status',prev:existing.dealStatus||'draft',next:status,ts:ts2});
    if(dealEntries.length>0){S.dealAuditLog=S.dealAuditLog.concat(dealEntries);dealEntries.forEach(function(en){syncAudit(en);});}
    S.deals=S.deals.map(function(x){return x._id===S.eid?updated:x;});
    syncDeal(updated);

  } else {
    var nid=nextDealId(f.serviceType);

function persistLead(lf, status, msg){
  var ts=new Date().toLocaleString();
  lf.leadStatus=status;
  if(S.leid!==null){
    var old=S.leads.filter(function(x){return x._id===S.leid;})[0]||{};
    var tracked=Object.assign({},lf,{bizStructure:S.biz});
    var changed=Object.keys(FL).filter(function(k){return String(tracked[k]||'')!==String(old[k]||'');});
    var entries=changed.map(function(k){return {_id:Date.now()+Math.random(),leadId:lf.leadId||'n/a',user:S.auditUser,field:FL[k],prev:String(old[k]||'n/a'),next:String(tracked[k]||'n/a'),ts:ts};});
    if(entries.length>0){S.auditLog=S.auditLog.concat(entries);entries.forEach(function(en){syncAudit(en);});}
    var updated=Object.assign({},lf,{_id:S.leid,files:(old.files||[]).concat(S.lfiles),bizStructure:S.biz});
    S.leads=S.leads.map(function(x){return x._id===S.leid?updated:x;});
    syncLead(updated);
    flash(msg);S.leid=null;
  } else {
    var nid=nextLeadId(lf.serviceType);
    var newLead=Object.assign({},lf,{_id:'L'+Date.now(),leadId:nid,files:S.lfiles,bizStructure:S.biz});
    S.leads=S.leads.concat([newLead]);
    var auditEntry={_id:Date.now(),leadId:nid,user:S.auditUser,field:'n/a',prev:'n/a',next:status==='draft'?'Lead saved as draft':'Lead submitted',ts:ts};
    S.auditLog=S.auditLog.concat([auditEntry]);

}

function rOverview(){
  // ── Computed metrics ──────────────────────────────────────────────────────
  var totalDeals=S.deals.length;
  var totalLeads=S.leads.length;
  var activeDeals=S.deals.filter(function(d){return d.status==='Active';}).length;
  var completedDeals=S.deals.filter(function(d){return d.status==='Completed';}).length;
  var onHoldDeals=S.deals.filter(function(d){return d.status==='On Hold';}).length;
  var cancelledDeals=S.deals.filter(function(d){return d.status==='Cancelled';}).length;

  // Leads by label
  var hotLeads=S.leads.filter(function(l){return l.label==='Hot';}).length;
  var warmLeads=S.leads.filter(function(l){return l.label==='Warm';}).length;
  var coldLeads=S.leads.filter(function(l){return l.label==='Cold';}).length;

  // Leads by status — 'pending' = submitted awaiting approval
  var pendingLeads=S.leads.filter(function(l){return l.leadStatus==='pending';}).length;
  var draftLeads=S.leads.filter(function(l){return l.leadStatus==='draft';}).length;
  var approvedLeads=S.leads.filter(function(l){return l.leadStatus==='approved';}).length;
  // Converted leads are deleted from leads table when converted — track via deals created from leads
  var convertedDeals=S.deals.filter(function(d){return d.source&&d.source!=='';}).length;

  // Deals by service type (including Valuation)
  var svcCounts={'Business Consulting':0,'Business Brokerage':0,'Business Funding':0,'Business Valuation':0,'Other':0};
  S.deals.forEach(function(d){
    if(svcCounts[d.serviceType]!==undefined) svcCounts[d.serviceType]++;
    else svcCounts['Other']++;
  });

  // Leads by service type (including Valuation)
  var leadSvcCounts={'Business Consulting':0,'Business Brokerage':0,'Business Funding':0,'Business Valuation':0,'Other':0};
  S.leads.forEach(function(l){
    if(leadSvcCounts[l.serviceType]!==undefined) leadSvcCounts[l.serviceType]++;
    else leadSvcCounts['Other']++;
  });

  // Deliverables progress
  var allDlvs=[];
  S.deals.forEach(function(d){(d.deliverables||[]).forEach(function(dlv){allDlvs.push(dlv);});});
  var totalDlvs=allDlvs.length;
  var doneDlvs=allDlvs.filter(function(d){return d.progress===100;}).length;
  var inProgDlvs=allDlvs.filter(function(d){return d.progress>0&&d.progress<100;}).length;
  var avgProgress=totalDlvs?Math.round(allDlvs.reduce(function(a,d){return a+(d.progress||0);},0)/totalDlvs):0;

  // Rates
  var approvalRate=totalLeads>0?Math.round(approvedLeads/totalLeads*100):0;
  var totalProcessed=totalLeads+S.deals.length;

  // Service colours
  var svcCol={'Business Consulting':'#2D6A4F','Business Brokerage':'#C8972A','Business Funding':'#7c3aed','Business Valuation':'#0e7490','Other':'#94a3b8'};

  // Donut chart helper
  function donut(segments,size){
    var total=segments.reduce(function(a,s){return a+s.value;},0);
    if(!total) return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:#E8F5EE;display:flex;align-items:center;justify-content:center"><span style="font-size:12px;color:#5A7A65">No data</span></div>';
    var gradient='conic-gradient(';
    var cum=0;
    var parts=segments.map(function(s){
      var pct=total>0?s.value/total*100:0;
      var from=cum;cum+=pct;
      return s.color+' '+from.toFixed(1)+'% '+cum.toFixed(1)+'%';
    });
    gradient+=parts.join(',')+')'
    var inner=Math.round(size*0.6);
    return '<div style="position:relative;width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+gradient+';display:flex;align-items:center;justify-content:center">'+
      '<div style="width:'+inner+'px;height:'+inner+'px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center">'+
        '<div style="font-size:'+(size>140?22:16)+'px;font-weight:900;color:#1A4731">'+total+'</div>'+
        '<div style="font-size:10px;color:#5A7A65;font-weight:600;text-transform:uppercase;letter-spacing:.5px">Total</div>'+
      '</div>'+
    '</div>';
  }

  // Bar chart helper

    html+='<div><div class="field-lbl">Status</div><select id="cf-status"><option'+(cf.status==='Prospect'?' selected':'')+'>Prospect</option><option'+(cf.status==='Active'?' selected':'')+'>Active</option><option'+(cf.status==='Inactive'?' selected':'')+'>Inactive</option></select></div>';
    html+='<div><div class="field-lbl">Industry</div><select id="cf-industry"><option value="">Select...</option>'+['Agriculture','Banking & Finance','Construction','Education','Energy','Healthcare','Hospitality','Manufacturing','Mining','Real Estate','Retail','Technology','Telecommunications','Transport & Logistics','Other'].map(function(x){return '<option'+(cf.industry===x?' selected':'')+'>'+x+'</option>';}).join('')+'</select></div>';
    html+='<div><div class="field-lbl">Company Size</div><select id="cf-size"><option value="">Select...</option>'+['1–10 employees','11–50 employees','51–200 employees','201–500 employees','500+ employees'].map(function(x){return '<option'+(cf.size===x?' selected':'')+'>'+x+'</option>';}).join('')+'</select></div>';

    html+='<div><div class="field-lbl">Website</div><input id="cf-website" value="'+e(cf.website||'')+'" placeholder="www.company.com"/></div>';
    html+='<div style="grid-column:1/-1"><div class="field-lbl">Notes</div><textarea id="cf-notes" placeholder="Any relevant notes about this client..." style="min-height:60px">'+e(cf.notes||'')+'</textarea></div>';

    html+='<button id="cf-cancel" style="background:#E8F5EE;color:#5A7A65;border:1px solid #C8E6D4;border-radius:8px;padding:11px 24px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">Cancel</button>';
    html+='</div></div>';
  }

  // Client cards / table
  var filtered=(S.clientSearch||'').trim().toLowerCase();

    if(!filtered) return true;
    return (c.companyName||'').toLowerCase().includes(filtered)||(c.industry||'').toLowerCase().includes(filtered)||(c.location||'').toLowerCase().includes(filtered);
  });

  if(shown.length===0){
    html+='<div class="empty"><div style="font-size:44px;margin-bottom:12px">&#127970;</div><div style="font-size:18px;font-weight:800;color:#1A4731">'+(S.clients.length===0?'No clients yet':'No results found')+'</div><div style="font-size:13px;color:#5A7A65;margin-top:6px">'+(S.clients.length===0?'Click "+ New Client" to add your first client':'Try a different search term')+'</div></div>';
  } else {
    html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px">';
    shown.forEach(function(c){
      var cDeals=S.deals.filter(function(d){return d.clientId===c._id;}).length;
      var cLeads=S.leads.filter(function(l){return l.clientId===c._id;}).length;
      var statusColors={'Active':'#16a34a','Prospect':'#C8972A','Inactive':'#94a3b8'};
      var sc=statusColors[c.status]||'#94a3b8';
      html+='<div class="client-card" data-id="'+e(c._id)+'" style="background:#fff;border:1px solid #C8E6D4;border-radius:14px;padding:20px;cursor:pointer">';

      html+='</div>';
      html+='<div style="font-size:11px;color:#5A7A65;font-weight:600;margin-bottom:3px">'+e(c.clientId||'')+'</div>';
      if(c.industry) html+='<div style="font-size:12px;color:#5A7A65;margin-bottom:2px">&#127970; '+e(c.industry)+'</div>';
      if(c.location) html+='<div style="font-size:12px;color:#5A7A65;margin-bottom:10px">&#128205; '+e(c.location)+'</div>';
      html+='<div style="display:flex;gap:10px;border-top:1px solid #E8F5EE;padding-top:10px">';
      html+='<div style="text-align:center;flex:1"><div style="font-size:18px;font-weight:800;color:#1A4731">'+cDeals+'</div><div style="font-size:10px;color:#5A7A65;font-weight:600">DEALS</div></div>';
      html+='<div style="text-align:center;flex:1"><div style="font-size:18px;font-weight:800;color:#C8972A">'+cLeads+'</div><div style="font-size:10px;color:#5A7A65;font-weight:600">LEADS</div></div>';
      html+='<div style="text-align:center;flex:1"><div style="font-size:18px;font-weight:800;color:#5A7A65">'+(c.contacts||[]).length+'</div><div style="font-size:10px;color:#5A7A65;font-weight:600">CONTACTS</div></div>';
      html+='</div></div>';
    });
    html+='</div>';
  }

  html+='</div>';
  return html;
}


function rGantt(){
  var svcColors={'Business Consulting':'#2D6A4F','Business Brokerage':'#C8972A','Business Funding':'#7c3aed'};
  var svcLight={'Business Consulting':'#E8F5EE','Business Brokerage':'#FDF8EE','Business Funding':'#faf5ff'};

  // Week navigation
  var weekOffset=S.ganttWeek||0;
  var today=new Date();today.setHours(0,0,0,0);
  var dayOfWeek=today.getDay();
  var monday=new Date(today);
  monday.setDate(today.getDate()-((dayOfWeek+6)%7)+(weekOffset*7));

  // Build 21 days (3 weeks) for wide view
  var days=[];
  for(var i=0;i<21;i++){var d=new Date(monday);d.setDate(monday.getDate()+i);days.push(d);}

  function fmt(d){return d instanceof Date?d.toISOString().slice(0,10):'';}
  function fmtShort(d){return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getFullYear();}
  function dayLetter(d){return ['S','M','T','W','T','F','S'][d.getDay()];}
  function diffDays(a,b){return Math.round((new Date(b)-new Date(a))/(1000*60*60*24));}

  // Group months for header
  var monthGroups=[];
  days.forEach(function(d){
    var key=fmtShort(d);
    if(!monthGroups.length||monthGroups[monthGroups.length-1].label!==key){monthGroups.push({label:key,count:1});}
    else monthGroups[monthGroups.length-1].count++;
  });

  // Collect all rows
  var allDeals=S.deals.filter(function(d){return (d.deliverables||[]).length>0;});
  if(S.ganttSearch&&S.ganttSearch.trim()){
    var gsq=S.ganttSearch.toLowerCase().trim();
    allDeals=allDeals.filter(function(d){
      return (d.bizName||'').toLowerCase().indexOf(gsq)>=0||(d.dealId||'').toLowerCase().indexOf(gsq)>=0||(d.serviceType||'').toLowerCase().indexOf(gsq)>=0;
    });
  }

  // Priority color helper
  function priColor(p){return p==='High Priority'?'#dc2626':p==='Medium'?'#C8972A':'#64748b';}
  function priLight(p){return p==='High Priority'?'#fef2f2':p==='Medium'?'#FDF8EE':'#f8fafc';}

  var html='<div>';

  // Header
  html+='<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px">';
  html+='<div><div style="font-size:22px;font-weight:900;color:#1A4731">Deliverables Gantt Chart</div>';
  html+='<div style="font-size:12px;color:#5A7A65;margin-top:2px">Track all project deliverables across deals</div></div>';
  html+='<div style="display:flex;align-items:center;gap:10px">';
  html+='<button id="gw-prev" style="background:#E8F5EE;border:1px solid #C8E6D4;color:#2D6A4F;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">&#8592; Prev</button>';
  html+='<div style="font-size:13px;font-weight:700;color:#1A4731;min-width:160px;text-align:center">'+fmtShort(monday)+' &mdash; '+fmtShort(days[20])+'</div>';
  html+='<button id="gw-next" style="background:#E8F5EE;border:1px solid #C8E6D4;color:#2D6A4F;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Next &#8594;</button>';
  html+='<button id="gw-today" style="background:#1A4731;border:none;color:#fff;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">Today</button>';
  html+='</div></div>';
  // Search bar
  html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">';
  html+='<div style="position:relative;flex:1;max-width:420px">';
  html+='<span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#5A7A65;font-size:14px">&#128269;</span>';
  html+='<input id="gantt-search" value="'+e(S.ganttSearch||'')+'" placeholder="Search project by business name or deal ID..." style="padding:10px 12px 10px 36px;font-size:13px;border:1px solid #C8E6D4;border-radius:10px;width:100%;font-family:inherit;outline:none"/>';
  html+='</div>';
  if(S.ganttSearch) html+='<button id="gantt-clear" style="background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:8px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">&#10005; Clear</button>';
  if(S.ganttSearch) html+='<div style="font-size:12px;color:#5A7A65">Showing results for <strong style="color:#1A4731">"'+e(S.ganttSearch)+'"</strong></div>';
  html+='</div>';

  if(allDeals.length===0){
    html+='<div style="background:#fff;border:1px solid #C8E6D4;border-radius:14px;padding:60px;text-align:center"><div style="font-size:40px;margin-bottom:12px">&#128197;</div><div style="font-size:18px;font-weight:800;color:#1A4731;margin-bottom:6px">No deliverables yet</div><div style="font-size:13px;color:#5A7A65">Add deliverables to your deals to see them here.</div></div>';
    html+='</div>';return html;
  }

  var COL_W=34; // px per day column
  var LEFT_W=560; // px for left table

  // Project selector
  html+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center">';
  html+='<span style="font-size:11px;font-weight:700;color:#5A7A65;letter-spacing:.7px">VIEW PROJECT:</span>';
  html+='<button class="gantt-proj-sel" data-proj="all" style="padding:7px 16px;border-radius:20px;border:2px solid '+(S.ganttProject==='all'||!S.ganttProject?'#1A4731':'#C8E6D4')+';background:'+(S.ganttProject==='all'||!S.ganttProject?'#1A4731':'#fff')+';color:'+(S.ganttProject==='all'||!S.ganttProject?'#fff':'#5A7A65')+';font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s">All Projects ('+(allDeals.length)+')</button>';
  S.deals.filter(function(d){return (d.deliverables||[]).length>0;}).forEach(function(d){
    var c2=svcColors[d.serviceType]||'#2D6A4F';
    var on=S.ganttProject===d._id;
    html+='<button class="gantt-proj-sel" data-proj="'+e(d._id)+'" style="padding:7px 16px;border-radius:20px;border:2px solid '+(on?c2:'#C8E6D4')+';background:'+(on?c2:'#fff')+';color:'+(on?'#fff':'#5A7A65')+';font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+e(d.bizName||d.dealId||'Deal')+'</button>';
  });
  html+='</div>';
  // Filter allDeals by selected project
  if(S.ganttProject&&S.ganttProject!=='all') allDeals=allDeals.filter(function(d){return d._id===S.ganttProject;});
  html+='<div style="overflow-x:auto;border-radius:14px;border:1px solid #C8E6D4;box-shadow:0 2px 12px #1A47310d">';
  html+='<table style="border-collapse:collapse;font-size:12px;min-width:'+(LEFT_W+days.length*COL_W)+'px">';

  // ── Header Row 1: Month groups ──────────────────────────────────────────
  html+='<thead>';
  html+='<tr style="background:#0a1f13">';
  html+='<th colspan="8" style="padding:12px 16px;text-align:left;color:#86efac;font-size:14px;font-weight:900;border-right:2px solid rgba(255,255,255,.2);width:'+LEFT_W+'px;letter-spacing:.5px">&#128197; Project &amp; Deliverable Schedule</th>';
  monthGroups.forEach(function(mg){
    html+='<th colspan="'+mg.count+'" style="padding:8px 4px;text-align:center;color:#fff;font-size:13px;font-weight:900;border-left:1px solid rgba(255,255,255,.2);letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,.4)">'+mg.label+'</th>';
  });
  html+='</tr>';

  // ── Header Row 2: Column labels + Day numbers ────────────────────────────
  html+='<tr style="background:#0f2d1f;border-top:1px solid rgba(255,255,255,.1)">';
  var leftCols=[['ID','40px'],['TASK / DELIVERABLE','180px'],['OWNER','80px'],['PRIORITY','70px'],['START','72px'],['FINISH','72px'],['DAYS','46px'],['% DONE','64px']];
  leftCols.forEach(function(c){
    html+='<th style="padding:10px 8px;text-align:left;color:#fff;font-size:12px;font-weight:900;letter-spacing:.5px;white-space:nowrap;width:'+c[1]+';border-right:1px solid rgba(255,255,255,.2);background:#0f2d1f">'+c[0].charAt(0).toUpperCase()+c[0].slice(1).toLowerCase().replace('/ deliverable','/ Deliverable').replace('% done','% Done')+'</th>';
  });
  days.forEach(function(d){
    var isToday=fmt(d)===fmt(today);
    var isWknd=d.getDay()===0||d.getDay()===6;
    html+='<th style="width:'+COL_W+'px;padding:6px 2px;text-align:center;color:'+(isToday?'#fff':isWknd?'#fde68a':'#fff')+';font-size:13px;font-weight:'+(isToday?'900':'800')+';border-left:1px solid rgba(255,255,255,.15);background:'+(isToday?'rgba(200,151,42,.7)':isWknd?'rgba(0,0,0,.35)':'rgba(0,0,0,.1)')+'">'+'<div style="line-height:1.3">'+d.getDate()+'</div><div style="font-size:11px;font-weight:700">'+dayLetter(d)+'</div></th>';
      '<div>'+d.getDate()+'</div><div style="font-size:9px;opacity:.7">'+dayLetter(d)+'</div></th>';
  });
  html+='</tr></thead>';

  // ── Body rows ────────────────────────────────────────────────────────────
  html+='<tbody>';

  allDeals.forEach(function(deal,di){
    var col=svcColors[deal.serviceType]||'#2D6A4F';
    var colLight=svcLight[deal.serviceType]||'#E8F5EE';
    var dlvs=deal.deliverables||[];
    var dealAvg=dlvs.length?Math.round(dlvs.reduce(function(a,d){return a+(d.progress||0);},0)/dlvs.length):0;
    var dealStart=dlvs.filter(function(d){return d.start;}).map(function(d){return d.start;}).sort()[0]||'';
    var dealEnd=dlvs.filter(function(d){return d.end;}).map(function(d){return d.end;}).sort().reverse()[0]||'';
    var dealDur=dealStart&&dealEnd?diffDays(dealStart,dealEnd)+' days':'';

    // ── Deal group header row ────────────────────────────────────────────
    html+='<tr style="background:'+col+';border-top:2px solid '+col+'">';
    html+='<td style="padding:10px 8px;color:#fff;font-size:12px;font-weight:800;white-space:nowrap"><span style="background:rgba(255,255,255,.2);border-radius:4px;padding:2px 6px">'+e(deal.dealId||'?')+'</span></td>';
    html+='<td style="padding:10px 8px;color:#fff;font-size:13px;font-weight:800">'+e(deal.bizName||'Unknown Deal')+'</td>';
    html+='<td style="padding:10px 8px;color:rgba(255,255,255,.8);font-size:11px">'+e(deal.owner||'&mdash;')+'</td>';
    html+='<td style="padding:10px 8px"><span style="background:rgba(255,255,255,.25);color:#fff;border-radius:4px;padding:2px 8px;font-size:10px;font-weight:700">'+e(deal.serviceType||'Deal')+'</span></td>';
    html+='<td style="padding:10px 8px;color:rgba(255,255,255,.8);font-size:11px">'+e(dealStart||'&mdash;')+'</td>';
    html+='<td style="padding:10px 8px;color:rgba(255,255,255,.8);font-size:11px">'+e(dealEnd||'&mdash;')+'</td>';
    html+='<td style="padding:10px 8px;color:rgba(255,255,255,.8);font-size:11px;text-align:center">'+e(dealDur||'&mdash;')+'</td>';
    html+='<td style="padding:10px 8px"><div style="display:flex;align-items:center;gap:4px"><div style="flex:1;height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden"><div style="width:'+dealAvg+'%;height:100%;background:#fff;border-radius:4px"></div></div><span style="font-size:11px;font-weight:800;color:#fff;min-width:28px">'+dealAvg+'%</span></div></td>';
    // Gantt cells for deal row - show thin overview bar
    days.forEach(function(d){
      var ds=fmt(d);
      var inRange=dealStart&&dealEnd&&ds>=dealStart&&ds<=dealEnd;
      var isWknd=d.getDay()===0||d.getDay()===6;
      html+='<td style="border-left:1px solid rgba(255,255,255,.1);background:'+(inRange?'rgba(255,255,255,.15)':isWknd?'rgba(0,0,0,.15)':'')+';padding:2px">';
      if(inRange) html+='<div style="height:20px;background:rgba(255,255,255,.3);border-radius:2px"></div>';
      html+='</td>';
    });
    html+='</tr>';

    // ── Deliverable rows ────────────────────────────────────────────────
    dlvs.forEach(function(dlv,di2){
      var pct=dlv.progress||0;
      var TASK_COLORS=['#1e40af','#be123c','#b45309','#047857','#7e22ce','#0e7490','#c2410c','#4d7c0f','#be185d','#0369a1'];
      var taskColor=TASK_COLORS[di2%TASK_COLORS.length];
      var barCol=pct===100?'#16a34a':taskColor;
      var dur=dlv.start&&dlv.end?diffDays(dlv.start,dlv.end)+' d':'&mdash;';
      var rowBg=di2%2===0?'#fff':'#fafdfb';
      var pri=dlv.priority||'';

      html+='<tr style="background:'+rowBg+';border-bottom:1px solid #E8F5EE">';
      // ID
      var isExpanded=S.
      isExpanded=S.ganttExpDlv===dlv._id;
      var rs2=dlv.reviewStatus||'Draft';
      var rsBadgeCol={'Draft':'#94a3b8','Submitted for Review':'#C8972A','Under Review':'#2563eb','Revision Needed':'#dc2626','Approved':'#16a34a'}[rs2]||'#94a3b8';
      html+='<tr style="background:'+rowBg+';border-bottom:1px solid #E8F5EE">';
      html+='<td style="padding:9px 8px;border-left:3px solid '+col+';white-space:nowrap"><span style="color:'+col+';font-size:11px;font-weight:700;font-family:monospace">'+e(deal.dealId||'?')+'.'+(di2+1)+'</span></td>';
      // Task name
      html+='<td style="padding:9px 8px;font-weight:600;color:#1A4731;min-width:160px">'+
        '<div style="display:flex;align-items:center;gap:6px">'+
          '<button class="dlv-expand-btn" data-dealid="'+e(deal._id)+'" data-dlvid="'+e(dlv._id)+'" style="background:none;border:none;cursor:pointer;color:'+col+';font-size:14px;padding:0;flex-shrink:0;font-family:inherit">'+(isExpanded?'&#9660;':'&#9654;')+'</button>'+
          '<span>'+e(dlv.name)+'</span>'+
          (rs2!=='Draft'?'<span style="background:'+rsBadgeCol+'20;color:'+rsBadgeCol+';border-radius:4px;padding:1px 6px;font-size:9px;font-weight:700;white-space:nowrap">'+rs2+'</span>':'')+
          ((dlv.reviewFiles||[]).length>0?'<span style="background:#E8F5EE;color:#2D6A4F;border-radius:4px;padding:1px 6px;font-size:9px;font-weight:700">&#128196; '+(dlv.reviewFiles.length)+'</span>':'')+
        '</div>'+
      '</td>';
      // Owner
      html+='<td style="padding:9px 8px;color:#5A7A65;font-size:11px;white-space:nowrap">'+e(dlv.owner||'&mdash;')+'</td>';
      // Priority
      html+='<td style="padding:6px 8px">'+
        '<select class="dlv-pri-sel" data-dealid="'+e(deal._id)+'" data-dlvid="'+e(dlv._id)+'" style="font-size:10px;font-weight:700;border-radius:4px;padding:3px 5px;border:1px solid '+(pri==='High'?'#fecaca':pri==='Medium'?'#F5E6C3':pri==='Low'?'#C8E6D4':'#e2e8f0')+';background:'+(pri==='High'?'#fef2f2':pri==='Medium'?'#FDF8EE':pri==='Low'?'#E8F5EE':'#f8fafc')+';color:'+(pri==='High'?'#dc2626':pri==='Medium'?'#C8972A':pri==='Low'?'#2D6A4F':'#94a3b8')+';cursor:pointer;font-family:inherit;width:100%">'+
          '<option value=""'+(pri===''?' selected':'')+'>Set Priority</option>'+
          '<option value="Low"'+(pri==='Low'?' selected':'')+'>Low</option>'+
          '<option value="Medium"'+(pri==='Medium'?' selected':'')+'>Medium</option>'+
          '<option value="High"'+(pri==='High'?' selected':'')+'>High</option>'+
        '</select>'+
      '</td>';
      // Start
      html+='<td style="padding:9px 8px;color:#5A7A65;font-size:11px;white-space:nowrap">'+e(dlv.start||'&mdash;')+'</td>';
      // Finish
      html+='<td style="padding:9px 8px;color:#5A7A65;font-size:11px;white-space:nowrap">'+e(dlv.end||'&mdash;')+'</td>';
      // Duration
      html+='<td style="padding:9px 8px;color:#5A7A65;font-size:11px;text-align:center">'+dur+'</td>';
      // % Complete with bar
      html+='<td style="padding:9px 8px"><div style="display:flex;align-items:center;gap:4px"><div style="width:40px;height:8px;background:#E8F5EE;border-radius:4px;overflow:hidden;flex-shrink:0"><div style="width:'+pct+'%;height:100%;background:'+barCol+';border-radius:4px"></div></div><span style="font-size:11px;font-weight:700;color:'+barCol+'">'+pct+'%</span></div></td>';

      // Gantt bar cells
      var inRangeStart=dlv.start&&dlv.end;
      days.forEach(function(d){
        var ds=fmt(d);
        var isToday2=ds===fmt(today);
        var isWknd2=d.getDay()===0||d.getDay()===6;
        var inBar=inRangeStart&&ds>=dlv.start&&ds<=dlv.end;
        var fillPct=pct;
        // Progress fill: what fraction of the bar is "done"
        var fillW=0;
        if(inBar&&dlv.start&&dlv.end){
          var totalSpan=diffDays(dlv.start,dlv.end)||1;
          var dayPos=diffDays(dlv.start,ds);
          var progressDays=totalSpan*(pct/100);
          fillW=dayPos<progressDays?100:0;
        }
        html+='<td style="padding:2px 1px;border-left:1px solid '+(isToday2?'#C8972A':'#E8F5EE')+';background:'+(isToday2?'#FDF8EE50':isWknd2?'#f5f5f5':'')+'">';
        if(inBar){
          var isFirst=ds===dlv.start,isLast=ds===dlv.end;
          var radius=isFirst&&isLast?'4px':isFirst?'4px 0 0 4px':isLast?'0 4px 4px 0':'0';
          html+='<div style="height:24px;background:'+taskColor+'40;border-radius:'+radius+';overflow:hidden;position:relative;margin:1px 0">';
          if(fillW) html+='<div style="position:absolute;left:0;top:0;width:100%;height:100%;background:'+taskColor+';border-radius:inherit"></div>';
          else html+='<div style="position:absolute;left:0;top:0;width:100%;height:100%;background:'+taskColor+';opacity:.55;border-radius:inherit"></div>';
          html+='</div>';
        }
        html+='</td>';
      });
      html+='</tr>';
      if(isExpanded){ html+=rDlvReviewPanel(deal,dlv); }
    });
  });

  html+='</tbody></table></div>';
  html+='</div>';
  return html;
}

      if(!email.trim()||!pass.trim()){S.loginError='Please enter your email and password.';render();return;}
      // Check lockout first
      if(isLockedOut(email)){S.loginError=getLockoutMessage(email);render();return;}
      S.loginError='Signing in...';render();
      hashPassword(pass).then(function(hash){
        sbReq('GET','crm_users',null,'?email=eq.'+encodeURIComponent(email.trim().toLowerCase())+'&active=eq.true&select=*')
          .then(function(r){return r.json();})
          .then(function(data){
            if(!Array.isArray(data)||data.length===0){
              recordFailedAttempt(email);
              var rem=getRemainingAttempts(email);
              S.loginError=isLockedOut(email)?getLockoutMessage(email):'Invalid email or password. '+(rem>0?rem+' attempt'+(rem===1?'':'s')+' remaining.':'');
              render();return;
            }
            var user=data[0];
            if(user.password!==hash){
              recordFailedAttempt(email);
              var rem2=getRemainingAttempts(email);
              S.loginError=isLockedOut(email)?getLockoutMessage(email):'Incorrect password. '+(rem2>0?rem2+' attempt'+(rem2===1?'':'s')+' remaining.':'Account locked.');
              render();return;
            }
            // Success — clear failed attempts
            clearFailedAttempts(email);
            S.currentUser=user;S.loginError='';S.loginEmail='';
            sessionStorage.setItem('aa_crm_user',JSON.stringify(user));
            resetAutoLogout();
            loadUsers();render();
          }).catch(function(){S.loginError='Connection error. Please try again.';render();});

    var email=(document.getElementById('nu-email')||{}).value||'';
    var pass=(document.getElementById('nu-pass')||{}).value||'';
    var role=(document.getElementById('nu-role')||{}).value||'staff';
    S.addUserError='';
    if(!name.trim()||!email.trim()||!pass.trim()){S.addUserError='All fields are required.';render();return;}
    if(pass.length<6){S.addUserError='Password must be at least 6 characters.';render();return;}
    if(S.users.some(function(u){return u.email.toLowerCase()===email.trim().toLowerCase();})){S.addUserError='A user with this email already exists.';render();return;}
    hashPassword(pass).then(function(hash){
      var newUser={id:'USR'+Date.now(),name:name.trim(),email:email.trim().toLowerCase(),password:hash,role:role,active:true,created_at:new Date().toISOString()};
      S.users=S.users.concat([newUser]);createUser(newUser);
      S.showAddUser=false;flash('User '+name+' created!');render();
    });
  });
  document.querySelectorAll('.role-sel').forEach(function(el){
    el.addEventListener('change',function(){
      var uid=el.dataset.uid,role=el.value;
      S.users=S.users.map(function(u){
        if(u.id!==uid) return u;
        var updated=Object.assign({},u,{role:role});saveUser(updated);
        if(S.currentUser.id===uid){S.currentUser=updated;sessionStorage.setItem('aa_crm_user',JSON.stringify(updated));}
        return updated;
      });render();
    });
  });
  document.querySelectorAll('.toggle-user-btn').forEach(function(el){
    el.addEventListener('click',function(){
      var uid=el.dataset.uid,active=el.dataset.active!=='1';
      S.users=S.users.map(function(u){if(u.id!==uid) return u;var updated=Object.assign({},u,{active:active});saveUser(updated);return updated;});
      flash(active?'User activated.':'User deactivated.');render();
    });
  });
  document.querySelectorAll('.reset-pass-btn').forEach(function(el){
    el.addEventListener('click',function(){
      var uid=el.dataset.uid,name=el.dataset.name;
      var newPass=prompt('Enter new temporary password for '+name+':');
      if(!newPass||newPass.length<6){alert('Password must be at least 6 characters.');return;}
      hashPassword(newPass).then(function(hash){
        S.users=S.users.map(function(u){if(u.id!==uid) return u;var updated=Object.assign({},u,{password:hash});saveUser(updated);return updated;});
        flash('Password reset for '+name+'!');render();
      });
    });
  });
  document.querySelectorAll('.del-user-btn').forEach(function(el){
    el.addEventListener('click',function(){
      if(!confirm('Delete this user? This cannot be undone.')) return;
      var uid=el.dataset.uid;
      S.users=S.users.filter(function(u){return u.id!==uid;});
      deleteUserSB(uid);flash('User deleted.','err');render();
    });
  });
  // Deal file downloads
  document.querySelectorAll('.dl-file').forEach(function(el){
    el.addEventListener('click',function(ev){
      ev.stopPropagation();
      var d=S.deals.filter(function(x){return x._id===el.dataset.did;})[0];
      if(d&&d.files) downloadFile(d.files[parseInt(el.dataset.fi)]);
    });
  });
  document.querySelectorAll('.dl-lfile').forEach(function(el){
    el.addEventListener('click',function(){
      var l=S.leads.filter(function(x){return x._id===el.dataset.lid;})[0];
      if(l&&l.files) downloadFile(l.files[parseInt(el.dataset.fi)]);
    });
  });
}

S.form=bDeal();S.lform=bLead();
// Restore session
var _sess=sessionStorage.getItem('aa_crm_user');
if(_sess){try{S.currentUser=JSON.parse(_sess);resetAutoLogout();}catch(e){}}
render();
loadFromSupabase();
</script>
</body>
</html>
