// ─── Google Calendar Integration ─────────────────────────────────────────────
var GC_CLIENT_ID = '55780604748-7jmsl2q0l3mpdd3n37l5s5jorv2og780.apps.googleusercontent.com';
var GC_SCOPE = 'https://www.googleapis.com/auth/calendar.events';
var gcTokenClient = null;

function initGoogleCalendar(){
  if(typeof google === 'undefined' || !google.accounts) return;
  gcTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GC_CLIENT_ID,
    scope: GC_SCOPE,
    callback: function(resp){
      if(resp.error){ flash('Google sign-in failed: '+resp.error,'err'); return; }
      S.gcalToken = resp.access_token;
      // Get user info
      fetch('https://www.googleapis.com/oauth2/v3/userinfo',{
        headers:{ Authorization: 'Bearer '+resp.access_token }
      }).then(function(r){return r.json();}).then(function(info){
        S.gcalUser = info.name || info.email || 'Google User';
        flash('Connected to Google Calendar as '+S.gcalUser+'!');
        render();
      });
    }
  });
}

function connectGoogleCalendar(){
  if(!gcTokenClient){ initGoogleCalendar(); }
  if(gcTokenClient){ gcTokenClient.requestAccessToken(); }
  else { flash('Google Calendar not ready yet. Try again in a moment.','err'); }
}

function disconnectGoogleCalendar(){
  if(S.gcalToken) google.accounts.oauth2.revoke(S.gcalToken, function(){});
  S.gcalToken = null; S.gcalUser = null;
  flash('Disconnected from Google Calendar.');
  render();
}

function addToGoogleCalendar(act, lead){
  if(!S.gcalToken){ flash('Please connect Google Calendar first.','err'); return; }
  var startDT = act.date && act.time ? act.date+'T'+act.time+':00' : new Date().toISOString().slice(0,19);
  var endDT   = act.date && act.time ? act.date+'T'+(function(){
    var [h,m]=act.time.split(':').map(Number); h+=1; return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  }())+':00' : new Date(Date.now()+3600000).toISOString().slice(0,19);

  var event = {
    summary: act.type + (lead ? ' — ' + (lead.bizName||lead.ownerContact||'Lead') : ''),
    description: [
      act.note ? 'Notes: '+act.note : '',
      lead ? 'Business: '+(lead.bizName||'') : '',
      lead ? 'Contact: '+(lead.ownerContact||'') : '',
      lead ? 'Phone: '+(lead.phone||'') : '',
      lead ? 'Lead ID: '+(lead.leadId||'') : '',
      'Logged via African Aspirations CRM'
    ].filter(Boolean).join('\n'),
    start: { dateTime: startDT, timeZone: 'Africa/Accra' },
    end:   { dateTime: endDT,   timeZone: 'Africa/Accra' },
    reminders: { useDefault: true }
  };

  fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
    method: 'POST',
    headers: { Authorization: 'Bearer '+S.gcalToken, 'Content-Type': 'application/json' },
    body: JSON.stringify(event)
  }).then(function(r){
    if(r.ok){ flash('Event added to Google Calendar! &#128197;'); }
    else { r.json().then(function(e){ flash('Calendar error: '+(e.error&&e.error.message||'Unknown'),'err'); }); }
  }).catch(function(){ flash('Could not connect to Google Calendar.','err'); });
}

window.addEventListener('load', function(){ setTimeout(initGoogleCalendar, 1500); });

// ─── Brute Force Protection ──────────────────────────────────────────────────
var MAX_ATTEMPTS = 5;
var LOCKOUT_MS   = 15 * 60 * 1000; // 15 minutes

function isLockedOut(email) {
  var key = email.toLowerCase().trim();
  var entry = S.loginAttempts[key];
  if (!entry) return false;
  if (entry.lockedUntil && Date.now() < entry.lockedUntil) return true;
  // Lock expired — reset
  if (entry.lockedUntil && Date.now() >= entry.lockedUntil) {
    delete S.loginAttempts[key];
  }
  return false;
}

function getLockoutMessage(email) {
  var key = email.toLowerCase().trim();
  var entry = S.loginAttempts[key];
  if (!entry || !entry.lockedUntil) return '';
  var remaining = Math.ceil((entry.lockedUntil - Date.now()) / 60000);
  return 'Account temporarily locked after too many failed attempts. Try again in ' + remaining + ' minute' + (remaining === 1 ? '' : 's') + '.';
}

function recordFailedAttempt(email) {
  var key = email.toLowerCase().trim();
  if (!S.loginAttempts[key]) S.loginAttempts[key] = { count: 0, lockedUntil: null };
  S.loginAttempts[key].count++;
  if (S.loginAttempts[key].count >= MAX_ATTEMPTS) {
    S.loginAttempts[key].lockedUntil = Date.now() + LOCKOUT_MS;
  }
}

function getRemainingAttempts(email) {
  var key = email.toLowerCase().trim();
  var entry = S.loginAttempts[key];
  if (!entry) return MAX_ATTEMPTS;
  return Math.max(0, MAX_ATTEMPTS - entry.count);
}

function clearFailedAttempts(email) {
  delete S.loginAttempts[email.toLowerCase().trim()];
}

// ─── Auto-logout (10 min inactivity) ────────────────────────────────────────
var _autoLogoutTimer=null;
var AUTO_LOGOUT_MS=10*60*1000; // 10 minutes

function resetAutoLogout(){
  if(_autoLogoutTimer) clearTimeout(_autoLogoutTimer);
  if(!S.currentUser) return;
  _autoLogoutTimer=setTimeout(function(){
    if(S.currentUser){
      S.currentUser=null;
      sessionStorage.removeItem('aa_crm_user');
      S.loginError='You were signed out due to 10 minutes of inactivity.';
      render();
    }
  },AUTO_LOGOUT_MS);
}

// Reset timer on any user activity
['click','keydown','mousemove','touchstart','scroll'].forEach(function(evt){
  document.addEventListener(evt,resetAutoLogout,{passive:true});
});

// ─── Password Hashing ────────────────────────────────────────────────────────
async function hashPassword(password){
  var encoder=new TextEncoder();
  var data=encoder.encode(password+'AA_CRM_SALT_2026');
  var hash=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(hash)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

// ─── Supabase Configuration ───────────────────────────────────────────────────
var SB_URL = 'https://fsfqzemhrdbrltvvjsdo.supabase.co';
var SB_KEY = 'sb_publishable_4ZQ9V6GGg_o-ZLAUbn3Jvw_XtwH9H4F';
var SB_HEADERS = {
  'apikey': SB_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=minimal',
};

var SB_SYNCING = false;
var SB_CONNECTED = false;
var SB_ERROR = '';

function sbReq(method, table, body, query){
  var url = SB_URL + '/rest/v1/' + table + (query||'');
  var opts = {method:method, headers:Object.assign({},SB_HEADERS)};
  if(body) opts.body = JSON.stringify(body);
  if(method==='POST') opts.headers['Prefer'] = 'resolution=merge-duplicates,return=minimal';
  return fetch(url, opts).then(function(r){
    if(!r.ok){
      // Surface real HTTP errors (RLS denied, missing table, paused project)
      return r.text().then(function(t){
        var msg=method+' '+table+' failed ('+r.status+')';
        console.error('Supabase error:',msg,t);
        throw new Error(msg);
      });
    }
    return r;
  });
}

function sbUpsert(table, id, data){
  return sbReq('POST', table, {id:id, data:data});
}

function sbDelete(table, id){
  return sbReq('DELETE', table, null, '?id=eq.'+id);
}

function sbLoad(table){
  return sbReq('GET', table, null, '?select=id,data&order=created_at.asc')
    .then(function(r){return r.json();});
}

function loadUsers(){
  sbReq('GET','crm_users',null,'?select=*&order=created_at.asc')
    .then(function(r){return r.json();})
    .then(function(data){
      if(Array.isArray(data)) S.users=data;
      S.usersLoaded=true;
      render();
    }).catch(function(){S.usersLoaded=true;render();});

function fmtAudit(v){
  if(!v) return '';
  var d=new Date(v);
  if(isNaN(d.getTime())) return String(v);
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM';h=h%12;if(h===0)h=12;
  return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear()+', '+h+':'+(m<10?'0':'')+m+' '+ap;
}
function relTime(v){
  if(!v) return '';
  var d=new Date(v);if(isNaN(d.getTime())) return '';
  var s=Math.floor((Date.now()-d.getTime())/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+' min ago';
  if(s<86400) return Math.floor(s/3600)+' hr'+(Math.floor(s/3600)>1?'s':'')+' ago';
  var days=Math.floor(s/86400);
  if(days<30) return days+' day'+(days>1?'s':'')+' ago';
  var mo=Math.floor(days/30);
  if(mo<12) return mo+' month'+(mo>1?'s':'')+' ago';
  return Math.floor(mo/12)+' yr'+(Math.floor(mo/12)>1?'s':'')+' ago';
}

function buildContactRegistry(){
  // All known contacts (company + individual), de-duplicated by name.
  var reg=[];
  S.clients.forEach(function(c){
    (c.contacts||[]).forEach(function(ct){
      var nm=((ct.firstName||ct.name||'')+' '+(ct.lastName||'')).trim();
      if(!nm) return;
      reg.push({
        id:'company:'+c._id+':'+ct.id,
        kind:'company',
        label:nm+' — '+(c.companyName||'Client'),
        name:nm,
        email:ct.email||'',
        mobile:ct.mobile||ct.phone||'',
        clientId:c._id,
        clientName:c.companyName||'',
        clientCode:c.clientId||''
      });
    });
  });
  (S.individualContacts||[]).forEach(function(ic){
    var nm=((ic.firstName||'')+' '+(ic.lastName||'')).trim();
    if(!nm) return;
    reg.push({
      id:'individual:'+ic._id,
      kind:'individual',
      label:nm+(ic.org?' — '+ic.org:'')+' (Individual)',
      name:nm,
      email:ic.email||'',
      mobile:ic.mobile||'',
      clientId:'',
      clientName:'',
      clientCode:''
    });
  });
  // Sort: company contacts first (by client name), then individuals
  reg.sort(function(a,b){
    if(a.kind!==b.kind) return a.kind==='company'?-1:1;
    return a.label.localeCompare(b.label);
  });
  return reg;
}

function rLinkContactModal(){
  if(!S.linkContactModal) return '';
  // linkContactModal = {kind:'individual'|'company', contactId, clientId(if company)}
  var ctx=S.linkContactModal;
  var ct=null, currentClientId='';
  if(ctx.kind==='individual'){
    ct=(S.individualContacts||[]).filter(function(x){return x._id===ctx.contactId;})[0];
  } else {
    var srcClient=S.clients.filter(function(c){return c._id===ctx.clientId;})[0];
    if(srcClient) ct=(srcClient.contacts||[]).filter(function(x){return x.id===ctx.contactId;})[0];
    currentClientId=ctx.clientId;
  }
  if(!ct) return '';

  var contactName=((ct.firstName||ct.name||'')+' '+(ct.lastName||'')).trim()||'Unnamed contact';
  var contactInit=((ct.firstName||ct.name||'').charAt(0)+(ct.lastName||'').charAt(0)).toUpperCase()||'?';

  // Filter pool
  var clients=[].concat(S.clients).filter(function(c){return c._id!==currentClientId;});
  var q=(S.linkContactSearch||'').toLowerCase().trim();
  if(q) clients=clients.filter(function(c){
    return (c.companyName||'').toLowerCase().indexOf(q)>=0||(c.clientId||'').toLowerCase().indexOf(q)>=0||(c.industry||'').toLowerCase().indexOf(q)>=0||(c.location||'').toLowerCase().indexOf(q)>=0||(c.accountOwner||'').toLowerCase().indexOf(q)>=0;
  });
  if(S.linkContactStatus!=='All') clients=clients.filter(function(c){return (c.status||'Prospect')===S.linkContactStatus;});
  if(S.linkContactIndustry!=='All') clients=clients.filter(function(c){return c.industry===S.linkContactIndustry;});

  var industries=[];S.clients.forEach(function(c){if(c.industry&&industries.indexOf(c.industry)<0) industries.push(c.industry);});

  var selected=S.linkContactSelClient?S.clients.filter(function(c){return c._id===S.linkContactSelClient;})[0]:null;

function render(){
  try{
    // Persist current view so refresh keeps the user on the same page
    if(S.currentUser){
      try{sessionStorage.setItem('aa_crm_view',JSON.stringify({tab:S.tab,leadsView:S.leadsView,contactsView:S.contactsView,apqTab:S.apqTab,pipeSavedView:S.pipeSavedView,leadSavedView:S.leadSavedView}));}catch(e){}
    }
    // Save scroll position before rebuilding DOM
    var ca=document.querySelector('.content-area');
    var scrollTop=ca?ca.scrollTop:0;
    document.getElementById('app').innerHTML=S.currentUser?rApp():rLogin();
    bind();
    // Restore scroll position after rebuild
    var ca2=document.querySelector('.content-area');
    if(ca2&&scrollTop>0) ca2.scrollTop=scrollTop;
  } catch(err){
    document.getElementById('app').innerHTML='<div style="padding:40px;color:red;font-family:monospace;"><h2>Render Error</h2><pre>'+err.message+'\n'+err.stack+'</pre></div>';
    console.error('Render error:',err);
  }
}

// L32: ESC closes any open modal/drawer
if(!window._escBound){
  window._escBound=true;
  document.addEventListener('keydown',function(ev){
    if(ev.key!=='Escape') return;
    var dirty=false;
    if(S.convertModal){S.convertModal=null;dirty=true;}
    else if(S.approvalModal){S.approvalModal=null;dirty=true;}
    else if(S.confirmModal){S.confirmModal=null;dirty=true;}
    else if(S.newContactModal){S.newContactModal=false;S.newContactKind=null;S.newContactClientId=null;dirty=true;}
    else if(S.linkContactModal){S.linkContactModal=null;S.linkContactSelClient=null;dirty=true;}
    else if(S.qaActionModal){S.qaActionModal=null;S.qaActionContact=null;S.qaActionClient=null;dirty=true;}
    else if(S.leadDrawer){S.leadDrawer=null;dirty=true;}
    else if(S.pipeDrawer){S.pipeDrawer=null;dirty=true;}
    else if(S.apqDrawer){S.apqDrawer=null;dirty=true;}
    else if(S.showICForm){S.showICForm=false;S.editICId=null;S.icForm=null;dirty=true;}
    else if(S.showClientForm){S.showClientForm=false;S.editClientId=null;S.clientForm=null;dirty=true;}
    else if(S.pipeMenu){S.pipeMenu=null;dirty=true;}
    else if(S.leadMenu){S.leadMenu=null;dirty=true;}
    if(dirty) render();
  });
}

function rDash(){
  var VL=visLeads(),VD=visDeals();
  var totalDeals=VD.length;
  var totalLeads=VL.length;
  var totalClients=S.clients.length;
  var activeDeals=VD.filter(function(d){return d.status==='Active';}).length;
  var pendingLeads=VL.filter(function(l){return l.leadStatus==='pending';}).length;
  var hotLeads=VL.filter(function(l){return l.label==='Hot';}).length;
  var completedDeals=VD.filter(function(d){return d.status==='Completed';}).length;
  var allDlvs=[];VD.forEach(function(d){(d.deliverables||[]).forEach(function(dlv){allDlvs.push(dlv);});});
  var avgProg=allDlvs.length?Math.round(allDlvs.reduce(function(a,d){return a+(d.progress||0);},0)/allDlvs.length):0;

  var svcMap={'Business Consulting':'Consulting','Business Brokerage':'Brokerage','Business Funding':'Funding','Business Valuation':'Valuation'};
  var svcCol={'Business Consulting':'#275F45','Business Brokerage':'#D97706','Business Funding':'#7C3AED','Business Valuation':'#0E7490'};

  var html='<div>';

  // Page header
  html+='<div class="page-header">'+
    '<div class="page-header-left">'+
      '<h1>Dashboard</h1>'+
      '<p>Welcome back, '+e(S.currentUser?S.currentUser.name:'')+'</p>'+
    '</div>'+
    '<div class="page-header-actions">'+
      '<button class="btn btn-secondary" data-tab="leads" style="font-size:12px;">+ New Lead</button>'+
      '<button class="btn" data-tab="form" style="font-size:12px;">+ New Deal</button>'+
    '</div>'+
  '</div>';

  // KPI strip
  html+='<div class="kpi-grid">';
  [
    [totalClients,'Total Clients','#275F45','CLI'],
    [totalLeads,'Total Leads','#5F6B65','All'],
    [pendingLeads,'Pending Approval','#D97706','⏳'],
    [activeDeals,'Active Deals','#275F45','🟢'],
    [completedDeals,'Completed Deals','#2E7D32','✓'],
    [avgProg+'%','Avg. Progress','#0E7490','◕'],

function rFL(files,p){
  return files.map(function(f,i){
    return '<div style="display:flex;align-items:center;justify-content:space-between;background:#f8fafc;border:1px solid #C8E6D4;border-radius:6px;padding:5px 10px;margin-bottom:4px">'+

    '</div>';
  }).join('');
}

function dealProg(d){
  var dl=d.deliverables||[];
  if(!dl.length) return 0;
  return Math.round(dl.reduce(function(a,x){return a+(x.progress||0);},0)/dl.length);
}
function dealDue(d){return d.dueDate||d.endDate||'';}
function dealStage(d){
  if(d.pipelineStage) return d.pipelineStage;
  if(d.status==='Completed') return 'Completed';
  if(d.status==='On Hold') return 'On Hold';
  if(d.status==='Cancelled') return 'Cancelled';
  return 'New Deal';
}
function isOverdue(d){
  var due=dealDue(d);if(!due) return false;
  var st=dealStage(d);if(st==='Completed'||st==='Cancelled') return false;
  return new Date(due+'T23:59:59')<new Date();
}
function isDueThisWeek(d){
  var due=dealDue(d);if(!due) return false;
  var st=dealStage(d);if(st==='Completed'||st==='Cancelled') return false;
  var dd=new Date(due+'T00:00:00'),now=new Date(),wk=new Date();wk.setDate(now.getDate()+7);
  return dd>=new Date(now.toDateString())&&dd<=wk;
}

function leadStage(l){
  if(l.converted) return 'Converted';
  if(l.rejected||l.leadStatus==='rejected') return 'Rejected';
  if(l.approved||l.leadStatus==='approved') return 'Approved';
  if(l.leadStatus==='moreinfo') return 'More Info Required';
  if(l.leadStatus==='review') return 'Under Review';
  if(l.leadStatus==='pending') return 'Submitted';
  return 'Draft';
}
function leadApproval(l){
  if(l.rejected||l.leadStatus==='rejected') return 'Rejected';
  if(l.approved||l.leadStatus==='approved') return 'Approved';
  if(l.leadStatus==='moreinfo') return 'Needs Changes';
  return 'Pending Review';
}
function leadReadiness(l){
  if(l.converted) return 'Already Converted';
  if(!(l.files&&l.files.length>0)) return 'Missing Documents';
  if(!(l.bizName&&l.serviceType&&l.ownerContact&&l.salesLead)) return 'Incomplete Details';
  if(!(l.approved||l.leadStatus==='approved')) return 'Needs Approval';
  return 'Ready to Convert';
}

function nextDealId(serviceType){
  var prefix='D';
  if(serviceType==='Business Consulting') prefix='C';
  else if(serviceType==='Business Brokerage') prefix='B';
  else if(serviceType==='Business Funding') prefix='F';
  else if(serviceType==='Business Valuation') prefix='V';
  var max=0;
  S.deals.forEach(function(d){
    var id=d.dealId||'';
    if(id.charAt(0)===prefix){
      var num=parseInt(id.slice(1),10);
      if(!isNaN(num)&&num>max) max=num;
    }
  });
  return prefix+('0000'+(max+1)).slice(-5);
}

function persistDeal(status,msg){
  S.form=gDF();var f=S.form;
  f.dealStatus=status;
  var ts2=new Date().toLocaleString();
  var actor=S.currentUser?S.currentUser.name:(S.auditUser||'Unknown');
  if(S.eid!==null){
    var existing=S.deals.filter(function(x){return x._id===S.eid;})[0]||{};
    var liveDelivs=(S.deals.filter(function(x){return x._id===S.eid;})[0]||{}).deliverables||[];
    var updated=Object.assign({},existing,f,{_id:S.eid,files:(existing.files||[]).concat(S.dfiles),deliverables:liveDelivs.length>0?liveDelivs:(f.deliverables||[]),createdAt:existing.createdAt,createdBy:existing.createdBy,updatedAt:new Date().toISOString(),updatedBy:actor});
    // Track changed fields
    var changedFields=Object.keys(FLD).filter(function(k){return String(f[k]||'')!==String(existing[k]||'')&&k!=='dealStatus';});
    var dealEntries=changedFields.map(function(k){return {_id:'DA'+Date.now()+Math.random(),dealId:updated.dealId,dealRef:S.eid,user:actor,field:FLD[k],prev:String(existing[k]||'n/a'),next:String(f[k]||'n/a'),ts:ts2};});
    if(status!==existing.dealStatus) dealEntries.push({_id:'DA'+Date.now()+Math.random(),dealId:updated.dealId,dealRef:S.eid,user:actor,field:'Status',prev:existing.dealStatus||'draft',next:status,ts:ts2});
    if(dealEntries.length>0){S.dealAuditLog=S.dealAuditLog.concat(dealEntries);dealEntries.forEach(function(en){syncAudit(en);});}
    S.deals=S.deals.map(function(x){return x._id===S.eid?updated:x;});
    syncDeal(updated);
    flash(msg);S.eid=null;
  } else {
    var nid=nextDealId(f.serviceType);
    var newDeal=Object.assign({},f,{_id:'D'+Date.now(),dealId:nid,files:S.dfiles,deliverables:f.deliverables||[],createdAt:new Date().toISOString(),createdBy:actor});
    S.deals=S.deals.concat([newDeal]);

    S.dealAuditLog=S.dealAuditLog.concat([createEntry]);
    syncAudit(createEntry);
    flash(msg+' ID: '+nid);
  }
  S.form=bDeal();S.dfiles=[];S.tab='pipeline';render();
}

function persistLead(lf, status, msg){
  // #14: track lastSubmittedAt on submission
  // B4: treat both 'submitted' and 'pending' as a submission event
  var _isSubmission=(status==='submitted'||status==='pending');
  var ts=new Date().toLocaleString();
  lf.leadStatus=status;
  if(S.leid!==null){
    var old=S.leads.filter(function(x){return x._id===S.leid;})[0]||{};
    var tracked=Object.assign({},lf,{bizStructure:S.biz});
    var changed=Object.keys(FL).filter(function(k){return String(tracked[k]||'')!==String(old[k]||'');});
    var entries=changed.map(function(k){return {_id:Date.now()+Math.random(),leadId:lf.leadId||'n/a',user:S.auditUser,field:FL[k],prev:String(old[k]||'n/a'),next:String(tracked[k]||'n/a'),ts:ts};});
    if(entries.length>0){S.auditLog=S.auditLog.concat(entries);entries.forEach(function(en){syncAudit(en);});}
    var critical=['bizName','serviceType','ownerContact','salesLead'];
    var wasApproved=!!(old.approved||old.leadStatus==='approved');
    // H14: don't punish users for filling in empty fields on legacy approved leads
    var criticalChanged=wasApproved&&critical.some(function(k){
      var oldV=(old[k]||'').toString().trim();
      var newV=(lf[k]||'').toString().trim();
      // Only revert if BOTH old and new exist and differ (a real change)
      return oldV&&newV&&oldV!==newV;
    });
    var actor=S.currentUser?S.currentUser.name:S.auditUser;
    var nowIso=new Date().toISOString();
    var updated=Object.assign({},lf,{_id:S.leid,files:(old.files||[]).concat(S.lfiles),bizStructure:S.biz,createdAt:old.createdAt,createdBy:old.createdBy,updatedAt:nowIso,updatedBy:actor});
    if(_isSubmission){updated.lastSubmittedAt=nowIso;if(!updated.firstSubmittedAt) updated.firstSubmittedAt=old.firstSubmittedAt||old.createdAt||nowIso;}
    if(criticalChanged){
      // #8: Soft-lock — revert to Under Review, clear approval, audit-log
      updated.approved=false;
      updated.approvedAt='';
      updated.approvedBy='';
      updated.leadStatus='review';
      updated.revertedToReviewAt=nowIso;
      updated.revertedToReviewBy=actor;
      var changedFields=critical.filter(function(k){return (old[k]||'')!==(lf[k]||'');}).map(function(k){return k+': '+(old[k]||'(empty)')+' → '+(lf[k]||'(empty)');}).join('; ');
      var entry={_id:nextAuditId(),leadId:lf.leadId||'',user:actor,field:'Approval Reverted',prev:'Approved',next:'Under Review (critical fields changed: '+changedFields+')',ts:new Date().toLocaleString()};
      S.auditLog=S.auditLog.concat([entry]);
      if(typeof syncAudit==='function') syncAudit(entry);
      setTimeout(function(){flash('Lead reverted to Under Review — critical fields changed.','err');},0);
    }
    S.leads=S.leads.map(function(x){return x._id===S.leid?updated:x;});
    syncLead(updated);
    flash(msg);S.leid=null;
  } else {
    var nid=nextLeadId(lf.serviceType);
    var _now=new Date().toISOString();var newLead=Object.assign({},lf,{_id:'L'+Date.now(),leadId:nid,files:S.lfiles,bizStructure:S.biz,createdAt:_now,createdBy:S.currentUser?S.currentUser.name:S.auditUser});if(_isSubmission){newLead.lastSubmittedAt=_now;newLead.firstSubmittedAt=_now;}
    S.leads=S.leads.concat([newLead]);
    var auditEntry={_id:nextAuditId(),leadId:nid,user:S.auditUser,field:'n/a',prev:'n/a',next:status==='draft'?'Lead saved as draft':'Lead submitted',ts:ts};
    S.auditLog=S.auditLog.concat([auditEntry]);
    syncLead(newLead);
    syncAudit(auditEntry);
    flash(msg+' ID: '+nid);
  }
  S.lform=bLead();S.lfiles=[];S.biz='';
  S.leadsView='pipeline';  // redirect to pipeline after save/submit
  render();
}

function revertDealToLead(dealId){
  if(!S.currentUser||(S.currentUser.role!=='admin'&&S.currentUser.role!=='manager')){
    flash('Only Managers and Admins can revert a deal.','err');return;
  }
  var d=S.deals.filter(function(x){return x._id===dealId;})[0];
  if(!d){flash('Deal not found.','err');return;}
  if(d.archived){flash('Deal is already archived.','err');return;}
  if(!d.convertedFromLead){
    flash('Cannot revert: deal has no linked lead.','err');return;
  }
  var lead=S.leads.filter(function(L){return L._id===d.convertedFromLead;})[0];
  if(!lead){
    flash('Cannot revert: original lead no longer exists.','err');return;
  }
  var reason=prompt('Reason for reverting this deal back to a lead?\n(e.g. needs document updates, scope changed)','');
  if(!reason||!reason.trim()){flash('Revert cancelled — reason required.','err');return;}

  var actor=S.currentUser.name;
  var ts=new Date().toISOString();

  // Restore lead: clear converted state, move files back, mark for re-review
  S.leads=S.leads.map(function(L){
    if(L._id!==lead._id) return L;
    var u=Object.assign({},L,{
      converted:false,
      convertedAt:'',
      convertedBy:'',
      convertedToDealId:'',
      convertedToDealRef:'',
      // Reset approval too — team needs to fix and resubmit
      approved:false,
      approvedAt:'',
      approvedBy:'',
      leadStatus:'review',
      // Restore files from deal (lead.files was cleared on conversion)
      files:(d.files||[]).concat(d.teamFiles||[]),
      revertedFromDealId:d.dealId,
      revertedFromDealAt:ts,
      revertedFromDealBy:actor,
      revertReason:reason.trim(),
      lastSubmittedAt:ts,  // treat as fresh submission for SLA
      updatedAt:ts,
      updatedBy:actor
    });
    syncLead(u);
    return u;
  });

  // Archive the deal — keep audit trail, hide from active pipeline
  S.deals=S.deals.map(function(x){
    if(x._id!==dealId) return x;
    var u=Object.assign({},x,{
      archived:true,
      archivedAt:ts,
      archivedBy:actor,
      revertReason:reason.trim(),
      status:'Reverted',
      updatedAt:ts,
      updatedBy:actor
    });
    syncDeal(u);
    return u;
  });

  // Audit log on both sides
  var en1={_id:nextAuditId(),leadId:lead.leadId||'',user:actor,field:'Reverted from Deal',prev:'Converted',next:'Under Review — '+reason.trim(),ts:new Date().toLocaleString()};
  S.auditLog=S.auditLog.concat([en1]);
  if(typeof syncAudit==='function') syncAudit(en1);
  var en2={_id:nextAuditId(),dealRef:d._id,dealId:d.dealId,user:actor,field:'Deal Reverted',prev:'Active',next:'Archived — reverted to lead: '+reason.trim(),ts:new Date().toLocaleString()};
  S.dealAuditLog=S.dealAuditLog.concat([en2]);

  S.pipeDrawer=null;
  S.pipeMenu=null;
  flash('Deal '+d.dealId+' reverted. Lead '+lead.leadId+' is now Under Review for resubmission.');
  render();
}


function cvt(id){
  var l=S.leads.filter(function(x){return x._id===id;})[0];
  if(!l){flash('Lead not found.','err');return;}

  // ── BLOCKER #3 GUARD: enforce readiness before conversion ────────────────
  if(l.converted){flash('This lead has already been converted.','err');return;}
  if(!(l.approved||l.leadStatus==='approved')){flash('Lead is not approved. Approve it first before converting.','err');return;}
  if(!(l.files&&l.files.length>0)){flash('Cannot convert: required documents are missing.','err');return;}
  if(!l.bizName||!l.bizName.trim()){flash('Cannot convert: business name is missing.','err');return;}
  if(!l.serviceType){flash('Cannot convert: service type is missing.','err');return;}
  if(!l.salesLead||!l.salesLead.trim()){flash('Cannot convert: Lead Owner is missing.','err');return;}
  if(!l.ownerContact||!l.ownerContact.trim()){flash('Cannot convert: Main Business Contact is missing.','err');return;}

  // ── BLOCKER #7 GUARD: prevent double-convert race ─────────────────────────
  var existing=S.deals.filter(function(d){return d.convertedFromLead===l._id;})[0];
  if(existing){flash('Lead already linked to deal '+(existing.dealId||existing._id),'err');return;}

  var nid=nextDealId(l.serviceType);
  var convertor=S.currentUser?S.currentUser.name:(S.auditUser||'Unknown');
  var convTs=new Date().toISOString();

  // M16: normalize priority vocabulary (lead uses 'High Priority', deals use 'High')
  var normPriority=(l.priority||'').replace(' Priority','');
  var newDeal2=Object.assign({},bDeal(),{
    _id:'D'+Date.now(),
    dealId:nid,
    bizName:l.bizName||l.ownerContact||'',
    priority:(l.priority||'').replace(' Priority','')||'',  // M16: normalize for deal model
    serviceType:l.serviceType||'',
    owner:l.salesLead||l.ownerContact||'',
    clientContact:l.ownerContact||'',
    email:l.email||'',phone:l.phone||'',source:l.source||'',
    projectBrief:l.projectBrief||'',
    startDate:l.startDate||'',endDate:l.endDate||'',
    status:'Active',
    priority:normPriority,
    files:l.files||[],
    deliverables:[],
    // Audit lineage
    createdAt:convTs, createdBy:convertor,
    convertedFromLeadId:l.leadId||'',
    convertedFromLead:l._id,
    leadCreatedAt:l.createdAt||'',
    leadCreatedBy:l.createdBy||'',
    leadApprovedAt:l.approvedAt||'',
    leadApprovedBy:l.approvedBy||'',
    convertedAt:convTs,
    convertedBy:convertor
  });

  // H6: atomic-ish — write deal first, on success stamp lead.
  // If deal write fails, sync error surfaces immediately and we don't strand the lead.
  // If lead stamp fails, surfaced separately; user can refresh and re-run (dedupe guard catches it).
  S.deals=S.deals.concat([newDeal2]);
  sbUpsert('deals', newDeal2._id, newDeal2).then(function(){
    S.leads=S.leads.map(function(x){
      if(x._id!==l._id) return x;
      var u=Object.assign({},x,{
        converted:true,
        convertedAt:convTs,
        convertedBy:convertor,
        convertedToDealId:newDeal2.dealId,
        convertedToDealRef:newDeal2._id,
        leadStatus:'converted',
        updatedAt:convTs,
        updatedBy:convertor,
        filesTransferredAt:convTs,
        filesTransferredCount:(x.files||[]).length,
        files:[]
      });
      sbUpsert('leads', u._id, u).then(function(){
        // Both writes confirmed
      }).catch(function(err){
        flash('WARNING: Deal '+newDeal2.dealId+' saved but lead status not updated. Refresh and contact admin. '+(err.message||''),'err');
      });
      return u;
    });
    render();
  }).catch(function(err){
    // Roll back local deal addition
    S.deals=S.deals.filter(function(d){return d._id!==newDeal2._id;});
    flash('Conversion FAILED: deal could not be saved. '+(err.message||'Try again.'),'err');
    render();
  });

  // Audit entries on both sides
  var en1={_id:nextAuditId(),leadId:l.leadId||'',user:convertor,field:'Conversion',prev:'Approved',next:'Converted to '+nid,ts:new Date().toLocaleString()};
  S.auditLog=S.auditLog.concat([en1]);syncAudit(en1);
  var en2={_id:nextAuditId(),dealRef:newDeal2._id,dealId:nid,user:convertor,field:'Created',prev:'',next:'Converted from lead '+(l.leadId||''),ts:new Date().toLocaleString()};
  S.dealAuditLog=S.dealAuditLog.concat([en2]);

  S.convertModal=null;
  flash('Lead converted to deal '+nid+'!');
  render();
}

function confirmApproval(){
  var u=(document.getElementById('apr-user')||{}).value||'';
  if(!u.trim()){
    var errEl=document.getElementById('apr-err');
    if(errEl){errEl.style.display='block';errEl.textContent='Please enter your name to approve.';}
    return;
  }
  var match={name:u};
  var leadId=S.approvalTargetId;
  var ts=new Date().toLocaleString();
  var isReject=S.approvalAction==='reject';
  var aprTs=new Date().toISOString();
  // ── BLOCKER #5: capture optional reason for reject ────────────────────────
  var reason=(document.getElementById('apr-reason')||{}).value||'';
  if(isReject&&!reason.trim()){
    var errEl=document.getElementById('apr-err');
    if(errEl){errEl.textContent='A rejection reason is required.';errEl.style.display='block';}
    return;
  }
  S.leads=S.leads.map(function(l){
    if(l._id!==leadId) return l;
    var updated=isReject
      ?Object.assign({},l,{
          rejected:true,
          rejectedBy:match.name,
          rejectedAt:aprTs,
          rejectionReason:reason.trim(),
          leadStatus:'rejected',
          approved:false,
          // ── BLOCKER #13 FIX: clear stale approval stamp on reject ─────────
          approvedAt:'', approvedBy:'',
          updatedAt:aprTs, updatedBy:match.name
        })
      :Object.assign({},l,{
          approved:true,
          approvedBy:match.name,
          approvedAt:aprTs,
          leadStatus:'approved',
          rejected:false,
          // BLOCKER #13: clear stale rejection on re-approve
          rejectedAt:'', rejectedBy:'', rejectionReason:'',
          // ── BLOCKER #2 FIX: stamp updatedAt on approval ───────────────────
          updatedAt:aprTs, updatedBy:match.name
        });
    syncLead(updated);
    return updated;
  });
  S.auditLog=S.auditLog.concat([{_id:nextAuditId(),leadId:(S.leads.filter(function(l){return l._id===leadId;})[0]||{}).leadId||'n/a',user:match.name,field:'Approval',prev:'Pending',next:(S.approvalAction==='reject'?'Rejected by ':'Approved by ')+match.name,ts:ts}]);
  S.currentApprover=match.name;
  flash(S.approvalAction==='reject'?('Lead rejected by '+match.name+'.'):('Lead approved by '+match.name+'!'));
  S.approvalModal=false;S.approvalTargetId=null;S.approvalAction=null;
  render();
}

function rDlvReviewPanel(deal, dlv){
  var rs = dlv.reviewStatus||'Draft';
  var files = dlv.reviewFiles||[];
  var comments = dlv.comments||[];
  var statusColors = {
    'Draft':'#94a3b8','Submitted for Review':'#C8972A',
    'Under Review':'#2563eb','Revision Needed':'#dc2626','Approved':'#16a34a'
  };
  var statusBg = {
    'Draft':'#f8fafc','Submitted for Review':'#FDF8EE',
    'Under Review':'#eff6ff','Revision Needed':'#fef2f2','Approved':'#f0fdf4'
  };
  var col = statusColors[rs]||'#94a3b8';
  var bg = statusBg[rs]||'#f8fafc';
  var isManager = S.currentUser&&(S.currentUser.role==='manager'||S.currentUser.role==='admin');
  var ddState = dlvDeadlineState(dlv);

  var html='<div style="padding:14px 18px;background:#fafdfb;">';

  // Deadline banner (if any)
  if(ddState){
    html+='<div style="display:flex;align-items:center;gap:8px;background:'+ddState.bg+';border:1px solid '+ddState.border+';border-left:3px solid '+ddState.color+';border-radius:4px;padding:8px 12px;margin-bottom:12px;">';
    html+='<span style="font-size:14px;color:'+ddState.color+';">&#9888;</span>';
    html+='<div style="font-size:11.5px;color:'+ddState.color+';font-weight:700;">'+ddState.label;
    if(ddState.kind==='overdue') html+=' <span style="font-weight:500;color:#5F6B65;">by '+Math.abs(ddState.days)+' day'+(Math.abs(ddState.days)!==1?'s':'')+' (due '+e(dlv.end)+')</span>';

function rContacts(){
  if(S.contactsView==='individual') return rIndividualContacts();

  // Gather ALL contacts from all clients
  var allContacts=[];
  S.clients.forEach(function(c){
    (c.contacts||[]).forEach(function(ct){
      allContacts.push(Object.assign({},ct,{
        _clientId:c._id,
        _clientName:c.companyName||'',
        _clientId2:c.clientId||''
      }));
    });
  });

  // ── Detail view ──────────────────────────────────────────────────────────
  if(S.contactView){
    var client=null,contact=null;
    S.clients.forEach(function(c){
      (c.contacts||[]).forEach(function(ct){
        if(ct.id===S.contactView){client=c;contact=ct;}
      });
    });
    if(!contact){S.contactView=null;render();return '';}
    var ct=contact;
    var fname=ct.firstName||ct.name||'';
    var lname=ct.lastName||'';
    var fullName=(fname+' '+lname).trim()||'Contact';
    var initials=((fname.charAt(0))+(lname.charAt(0))).toUpperCase()||'?';

    var strengthCol={'Strong':'#16a34a','Good':'#2563eb','Developing':'#D97706','Weak':'#dc2626'}[ct.relationshipStrength]||'#9BA8A2';
    var priorityCol={'High':'#dc2626','Medium':'#D97706','Low':'#16a34a'}[ct.clientPriority]||'#9BA8A2';

    html+='<button class="btn btn-sm" id="ct-save-contact" data-cid="'+e(ct.id)+'" data-clientid="'+e(client?client._id:'')+'">Save Contact</button>';

      if(ct.isDecisionMaker) html+='<span style="background:#ECFDF5;color:#2E7D32;border:1px solid #A7F3D0;border-radius:4px;padding:4px 12px;font-size:11px;font-weight:700;">&#9989; Decision Maker</span>';
      if(ct.isBudgetAuthority) html+='<span style="background:#FFFBEB;color:#D97706;border:1px solid #FDE68A;border-radius:4px;padding:4px 12px;font-size:11px;font-weight:700;">&#128176; Budget Authority</span>';
      if(ct.isInfluencer) html+='<span style="background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE;border-radius:4px;padding:4px 12px;font-size:11px;font-weight:700;">&#127775; Influencer</span>';

        html+='</div>';
      } else {
        var sortedActs=[].concat(acts).reverse();

      html+='<div><div style="font-weight:600;font-size:13px;color:#1A1A1A;">'+e(full)+'</div>';

      html+='<td style="font-size:12px;color:#5F6B65;">'+e(ct.mobile||ct.phone||'—')+'</td>';
      html+='<td>'+(ct.relationshipStrength?'<span style="background:'+sc+'18;color:'+sc+';border-radius:3px;padding:2px 7px;font-size:10px;font-weight:700;">'+e(ct.relationshipStrength)+'</span>':'<span style="color:#9BA8A2;font-size:12px;">—</span>')+'</td>';

      if(ct.isBudgetAuthority) html+='<span style="background:#FFFBEB;color:#D97706;border-radius:2px;padding:1px 5px;font-size:10px;font-weight:600;">BA</span>';
      if(ct.isInfluencer) html+='<span style="background:#EFF6FF;color:#1D4ED8;border-radius:2px;padding:1px 5px;font-size:10px;font-weight:600;">Inf</span>';
      html+='</div></td>';
      html+='<td style="white-space:nowrap;"><div style="display:flex;gap:4px;"><button class="btn btn-ghost btn-sm ct-view-btn" data-cid="'+e(ct.id)+'" style="font-size:11px;">View</button><button class="btn btn-ghost btn-sm cc-change-company-btn" data-cid="'+e(ct.id)+'" data-clientid="'+e(ct._clientId)+'" style="font-size:11px;" title="Change linked company">&#128279;</button></div></td>';
      html+='</tr>';
    });
    html+='</tbody></table></div></div>';
  }
  return html;
}

function dlvDeadlineState(dlv){
  if(!dlv||!dlv.end) return null;
  var pct=dlv.progress||0;
  if(pct>=100) return null;
  var today=new Date();today.setHours(0,0,0,0);
  var end=new Date(dlv.end);end.setHours(0,0,0,0);
  if(isNaN(end.getTime())) return null;
  var diffDays=Math.round((end-today)/86400000);
  if(diffDays<0) return {kind:'overdue',label:'Overdue',color:'#991B1B',bg:'#FEF2F2',border:'#FECACA',days:diffDays,priority:4};
  if(diffDays===0) return {kind:'today',label:'Due Today',color:'#991B1B',bg:'#FEF2F2',border:'#FECACA',days:0,priority:3};
  if(diffDays<=3) return {kind:'soon',label:'Due in '+diffDays+'d',color:'#C8972A',bg:'#FDF8EE',border:'#F5E6C3',days:diffDays,priority:2};
  if(diffDays<=7&&pct<50) return {kind:'risk',label:'At Risk',color:'#C8972A',bg:'#FDF8EE',border:'#F5E6C3',days:diffDays,priority:1};
  return null;
}

function dlvDeadlineBadge(dlv,compact){
  var ds=dlvDeadlineState(dlv);
  if(!ds) return '';
  if(compact){
    return '<span title="'+ds.label+(ds.days<0?' by '+Math.abs(ds.days)+' day'+(Math.abs(ds.days)!==1?'s':''):'')+'" style="display:inline-flex;align-items:center;gap:3px;background:'+ds.bg+';color:'+ds.color+';border:1px solid '+ds.border+';border-radius:3px;padding:1px 5px;font-size:8.5px;font-weight:700;margin-left:4px;vertical-align:middle;white-space:nowrap;">&#9888; '+ds.label+'</span>';
  }
  return '<span style="display:inline-flex;align-items:center;gap:4px;background:'+ds.bg+';color:'+ds.color+';border:1px solid '+ds.border+';border-radius:4px;padding:3px 8px;font-size:11px;font-weight:700;">&#9888; '+ds.label+'</span>';
}


function rGantt(){
  var GD=visDeals();

  // Neutral enterprise palette
  var C={
    text:'#0F172A', sub:'#64748B', muted:'#94A3B8', bord:'#E2E8F0', bordLt:'#F1F5F9',
    bg:'#FAFAFA', weekend:'#F8F8F7',
    primary:'#275F45', primaryLt:'#EAF3EE',
    amber:'#C8972A', amberLt:'#FDF8EE',
    red:'#991B1B', redLt:'#FEF2F2',
    blue:'#1E40AF', blueLt:'#EFF6FF',
    progEmpty:'#F1F5F9'
  };

  var weekOffset=S.ganttWeek||0;
  var today=new Date();today.setHours(0,0,0,0);
  var dayOfWeek=today.getDay();
  var monday=new Date(today);
  monday.setDate(today.getDate()-((dayOfWeek+6)%7)+(weekOffset*7));

  var days=[];
  for(var i=0;i<21;i++){var d=new Date(monday);d.setDate(monday.getDate()+i);days.push(d);}

function rApprovals(){
  var pending=S.leads.filter(function(l){return leadStage(l)==='Submitted'||leadStage(l)==='Under Review';});
  var moreinfo=S.leads.filter(function(l){return leadStage(l)==='More Info Required';});
  var approved=S.leads.filter(function(l){return leadStage(l)==='Approved';});
  var ready=approved.filter(function(l){return leadReadiness(l)==='Ready to Convert';});
  var rejected=S.leads.filter(function(l){return leadStage(l)==='Rejected';});
  var convertedDeals=S.deals.filter(function(d){return (d.convertedFromLeadId||d.convertedFromLead)&&!d.archived;});

  // M22: Average review time — current month only, not all-time
  var thisMonth=new Date().toISOString().slice(0,7);
  var revTimes=[];
  S.leads.forEach(function(l){
    if(l.approvedAt&&l.createdAt&&l.approvedAt.slice(0,7)===thisMonth){
      var a=new Date(l.approvedAt).getTime(),c=new Date(l.createdAt).getTime();
      if(!isNaN(a)&&!isNaN(c)&&a>c) revTimes.push(a-c);
    }
  });
  var avgMs=revTimes.length?revTimes.reduce(function(x,y){return x+y;},0)/revTimes.length:0;
  var avgLabel=avgMs?(avgMs<3600000?Math.round(avgMs/60000)+'m':avgMs<86400000?(avgMs/3600000).toFixed(1)+'h':(avgMs/86400000).toFixed(1)+'d'):'\u2014';

  var tab=S.apqTab||'pending';
  var html='<div>';

  // ── Header ───────────────────────────────────────────────────────────────
  html+='<div class="page-header"><div class="page-header-left"><h1>Lead Approval Queue</h1><p>Review submitted leads, approve qualified opportunities, and convert them into deal records</p></div>';

// L32: global ESC handler closes any open modal/drawer

    if(S.convertModal||S.approvalModal||S.confirmModal||S.newContactModal||S.linkContactModal||S.qaActionModal||S.leadDrawer||S.pipeDrawer||S.apqDrawer){
      S.convertModal=null;S.approvalModal=null;S.confirmModal=null;

  // ── B1 + H10: Manager actions (Approve / Request Revision / Under Review) ──
  document.querySelectorAll('.dlv-manager-action').forEach(function(el){
    el.addEventListener('click',function(ev){
      ev.stopPropagation();
      // H10 defense-in-depth: re-check role in handler
      if(!S.currentUser||(S.currentUser.role!=='manager'&&S.currentUser.role!=='admin')){
        flash('Only managers and admins can review deliverables.','err');return;
      }
      var dealId=el.dataset.dealid, dlvId=el.dataset.dlvid, action=el.dataset.action;
      var deal=S.deals.filter(function(d){return d._id===dealId;})[0];
      if(!deal){flash('Deal not found.','err');return;}
      var dlv=(deal.deliverables||[]).filter(function(x){return x._id===dlvId;})[0];
      if(!dlv){flash('Deliverable not found.','err');return;}

      // Request Revision requires a reason
      var reason='';
      if(action==='Revision Needed'){
        reason=prompt('What revision is needed for "'+(dlv.name||'this deliverable')+'"?','');
        if(reason===null) return; // cancelled
        if(!reason.trim()){flash('A revision reason is required.','err');return;}
      }

      var actor=S.currentUser.name;
      var ts=new Date().toISOString();
      var prevStatus=dlv.reviewStatus||'Draft';

      S.deals=S.deals.map(function(d){
        if(d._id!==dealId) return d;
        var dlvs=(d.deliverables||[]).map(function(x){
          if(x._id!==dlvId) return x;
          var u=Object.assign({},x,{
            reviewStatus:action,
            reviewedAt:ts,
            reviewedBy:actor
          });
          if(action==='Approved'){
            u.approvedDeliverableAt=ts;
            u.approvedDeliverableBy=actor;
            u.revisionReason=''; // clear any prior revision note
          }
          if(action==='Revision Needed'){
            u.revisionReason=reason.trim();
            u.revisionRequestedAt=ts;
            u.revisionRequestedBy=actor;
          }
          return u;
        });
        var upd=Object.assign({},d,{deliverables:dlvs,updatedAt:ts,updatedBy:actor});
        syncDeal(upd);return upd;
      });

      // Audit
      var entry={_id:nextAuditId(),dealRef:dealId,dlvId:dlvId,user:actor,field:'Deliverable Review',prev:prevStatus,next:action+(reason?' — '+reason.trim():''),ts:new Date().toLocaleString()};
      S.dealAuditLog=S.dealAuditLog.concat([entry]);
      if(typeof syncAudit==='function') syncAudit(entry);

      var msg=action==='Approved'?'Deliverable approved.':action==='Revision Needed'?'Revision requested.':'Marked under review.';
      flash(msg);
      render();
    });
  });

    var ts=new Date().toLocaleString();
    var entry={
      id:'ACT'+Date.now(),
      type:kind==='note'?'Note':kind==='meeting'?'Meeting':'Opportunity',
      user:actor, ts:ts,
      title:title, text:text,
      date:date, time:time, svc:svc, stage:stage
    };
    S.clients=S.clients.map(function(c){
      if(c._id!==S.qaActionClient) return c;
      var u=Object.assign({},c,{contacts:(c.contacts||[]).map(function(x){
        if(x.id!==S.qaActionContact) return x;
        var acts=(x.activities||[]).concat([entry]);
        var update={activities:acts,lastContactDate:date||new Date().toISOString().slice(0,10)};
        return Object.assign({},x,update);
      })});
      syncClient(u);return u;
    });
    closeQaModal();
    flash(entry.type+' saved.');
  });

  document.querySelectorAll('.ct-view-btn').forEach(function(el){
    el.addEventListener('click',function(){S.contactView=el.dataset.cid;S.contactTab='overview';render();});
  });

  // Back from contact detail
  var ctCancel=document.getElementById('ct-cancel-edit');
  if(ctCancel) ctCancel.addEventListener('click',function(){S.contactView=null;render();});

  // Save contact
  var ctSave=document.getElementById('ct-save-contact');
  if(ctSave) ctSave.addEventListener('click',function(){
    var cid=ctSave.dataset.cid, clientId=ctSave.dataset.clientid;
    var updates={};
    document.querySelectorAll('[name^="ct-"]').forEach(function(el){
      var key=el.name.replace('ct-','');
      updates[key]=el.type==='checkbox'?el.checked:el.value;
    });
    updates.name=(updates.firstName||'')+' '+(updates.lastName||'');
    S.clients=S.clients.map(function(c){
      if(c._id!==clientId) return c;
      var newContacts=(c.contacts||[]).map(function(ct){
        if(ct.id!==cid) return ct;
        return Object.assign({},ct,updates);
      });
      var updated=Object.assign({},c,{contacts:newContacts});
      syncClient(updated);
      return updated;
    });
    flash('Contact saved!');
    render();
  });

  // Log activity button
  var ctAddAct=document.getElementById('ct-add-activity');
  if(ctAddAct) ctAddAct.addEventListener('click',function(){
    var cid=ctAddAct.dataset.cid, clientId=ctAddAct.dataset.clientid;
    var type=prompt('Activity type: Email, Call, Meeting, Note, Task','Note');
    if(!type) return;
    var text=prompt('Notes:','');
    var newAct={type:type,text:text||'',ts:new Date().toLocaleString(),user:S.currentUser?S.currentUser.name:'User'};
    S.clients=S.clients.map(function(c){
      if(c._id!==clientId) return c;
      var newContacts=(c.contacts||[]).map(function(ct){
        if(ct.id!==cid) return ct;
        return Object.assign({},ct,{activities:(ct.activities||[]).concat([newAct])});
      });
      var updated=Object.assign({},c,{contacts:newContacts});
      syncClient(updated);return updated;
    });
    flash('Activity logged!');render();
  });

  // New contact from contacts list
  var ctNewBtn=document.getElementById('ct-new-btn');
  if(ctNewBtn) ctNewBtn.addEventListener('click',function(){
    // Navigate to clients tab to add
    if(S.clients.length===0){flash('Please create a Client Account first.','err');return;}
    S.tab='clients';render();flash('Select a client to add a contact.');
  });

  var clientBack=document.getElementById('client-back');
  if(clientBack) clientBack.addEventListener('click',function(){S.clientView=null;render();});

  // Edit client from profile
  document.querySelectorAll('.edit-client-btn').forEach(function(el){
    el.addEventListener('click',function(ev){
      ev.stopPropagation();
      var c=S.clients.filter(function(x){return x._id===el.dataset.id;})[0];
      if(!c) return;
      S.showClientForm=true;S.editClientId=c._id;S.clientForm=c;S.clientView=null;render();
    });
  });

  // Add contact
  document.querySelectorAll('.add-contact-btn').forEach(function(el){
    el.addEventListener('click',function(ev){
      ev.stopPropagation();
      var cid=el.dataset.id;
      var name=prompt('Contact Name:');
      if(!name||!name.trim()) return;
      var role=prompt('Role / Title (optional):','');
      var phone=prompt('Phone (optional):','');
      var email=prompt('Email (optional):','');
      var isPrimary=(S.clients.filter(function(c){return c._id===cid;})[0]||{}).contacts&&(S.clients.filter(function(c){return c._id===cid;})[0]||{}).contacts.length===0;
      S.clients=S.clients.map(function(c){
        if(c._id!==cid) return c;
        var newContact={id:'CNT'+Date.now(),name:name.trim(),role:role||'',phone:phone||'',email:email||'',isPrimary:isPrimary};
        var updated=Object.assign({},c,{contacts:(c.contacts||[]).concat([newContact])});
        syncClient(updated);return updated;
      });
      flash('Contact added!');render();
    });
  });

  // Delete contact
  document.querySelectorAll('.del-contact-btn').forEach(function(el){
    el.addEventListener('click',function(ev){
      ev.stopPropagation();
      if(!confirm('Remove this contact?')) return;
      var clientId=el.dataset.clientid, cid=el.dataset.cid;
      S.clients=S.clients.map(function(c){
        if(c._id!==clientId) return c;
        var updated=Object.assign({},c,{contacts:(c.contacts||[]).filter(function(ct){return ct.id!==cid;})});
        syncClient(updated);return updated;
      });
      flash('Contact removed.');render();
    });
  });

  // Click deal row in client view → go to pipeline
  document.querySelectorAll('.deal-row-link').forEach(function(el){
    el.addEventListener('click',function(){S.tab='pipeline';S.expId=el.dataset.did;S.clientView=null;render();});
  });

  // Lead sort dropdown
  var leadSortEl=document.getElementById('lead-sort');
  if(leadSortEl) leadSortEl.addEventListener('change',function(){S.leadSort=leadSortEl.value;render();});

  // Sortable column headers
  document.querySelectorAll('.sort-th').forEach(function(el){
    el.addEventListener('click',function(){S.leadSort=el.dataset.sort;render();});
  });

  var hdrLogout=document.getElementById('hdr-logout');
  if(hdrLogout) hdrLogout.addEventListener('click',function(){if(_autoLogoutTimer) clearTimeout(_autoLogoutTimer);S.currentUser=null;sessionStorage.removeItem('aa_crm_user');render();});
  var logoutBtn=document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.addEventListener('click',function(){if(_autoLogoutTimer) clearTimeout(_autoLogoutTimer);S.currentUser=null;sessionStorage.removeItem('aa_crm_user');render();});
  // ── Users & Settings: tab switching ───────────────────────────────────────
  document.querySelectorAll('.users-tab-btn').forEach(function(el){
    el.addEventListener('click',function(ev){
      ev.stopPropagation();
      S.usersTab=el.dataset.utab;
      S.usersActionMenu=null;
      S.showChangePassword=false;
      S.changePassError='';S.changePassSuccess='';
      render();
    });
  });

  // ── Team Members: search + filters ────────────────────────────────────────
  var usSearch=document.getElementById('users-search');
  if(usSearch) usSearch.addEventListener('input',function(){
    S.usersSearch=usSearch.value;
    render();
    setTimeout(function(){var ee=document.getElementById('users-search');if(ee){ee.focus();ee.setSelectionRange(S.usersSearch.length,S.usersSearch.length);}},0);
  });
  var usRole=document.getElementById('users-filter-role');
  if(usRole) usRole.addEventListener('change',function(){S.usersFilterRole=usRole.value;render();});
  var usStatus=document.getElementById('users-filter-status');
  if(usStatus) usStatus.addEventListener('change',function(){S.usersFilterStatus=usStatus.value;render();});

  // ── Three-dot actions menu ────────────────────────────────────────────────
  document.querySelectorAll('.users-menu-btn').forEach(function(el){
    el.addEventListener('click',function(ev){
      ev.stopPropagation();
      S.usersActionMenu=S.usersActionMenu===el.dataset.uid?null:el.dataset.uid;
      render();
    });
  });

  // ── Security: show/hide change-password form ──────────────────────────────
  var showCpBtn=document.getElementById('show-change-pass');
  if(showCpBtn) showCpBtn.addEventListener('click',function(){
    S.showChangePassword=true;S.changePassError='';S.changePassSuccess='';render();
  });
  var cpCancel=document.getElementById('cp-cancel');
  if(cpCancel) cpCancel.addEventListener('click',function(){
    S.showChangePassword=false;S.changePassError='';S.changePassSuccess='';render();
  });
  var signoutBtn=document.getElementById('signout-btn');
  if(signoutBtn) signoutBtn.addEventListener('click',function(){
    if(!confirm('Sign out of this session?')) return;
    sessionStorage.removeItem('aa_crm_user');
    S.currentUser=null;render();
  });

  // ── Add User modal: close + send-invite checkbox ──────────────────────────
  var nuClose=document.getElementById('nu-close');
  if(nuClose) nuClose.addEventListener('click',function(){S.showAddUser=false;render();});
  var nuOverlay=document.getElementById('add-user-overlay');
  if(nuOverlay) nuOverlay.addEventListener('click',function(ev){if(ev.target.id==='add-user-overlay'){S.showAddUser=false;render();}});
  var nuInvite=document.getElementById('nu-invite');
  if(nuInvite) nuInvite.addEventListener('change',function(){S.nuSendInvite=nuInvite.checked;});

  // ── Export Users (CSV) ────────────────────────────────────────────────────
  var expBtn=document.getElementById('users-export-btn');
  if(expBtn) expBtn.addEventListener('click',function(){
    var rows=[['Name','Email','Role','Status','Last Active','Created']];
    (S.users||[]).forEach(function(u){
      var st=u.status||(u.active===false?'Deactivated':u.invited?'Invited':'Active');
      rows.push([u.name||'',u.email||'',u.role||'staff',st,u.lastLogin||'',u.created_at||'']);
    });
    var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
    var blob=new Blob([csv],{type:'text/csv'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='users-export-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
    URL.revokeObjectURL(url);
    flash('Users exported.');
  });


  // ── Backup: download full JSON ────────────────────────────────────────────
  var backupBtn=document.getElementById('backup-download-btn');
  var goToBackup=document.getElementById('dash-goto-backup');
  if(goToBackup) goToBackup.addEventListener('click',function(ev){ev.preventDefault();S.tab='users';S.usersTab='backup';render();});

  if(backupBtn) backupBtn.addEventListener('click',function(){
    if(!S.currentUser||S.currentUser.role!=='admin'){flash('Admin only.','err');return;}
    var now=new Date();
    var iso=now.toISOString();
    var ymd=iso.slice(0,10);
    // Strip passwords from users
    var safeUsers=(S.users||[]).map(function(u){var c=Object.assign({},u);delete c.password;return c;});
    var payload={
      _meta:{
        appName:'African Aspirations Sales CRM',
        appVersion:'pilot-2026-06',
        backupVersion:1,
        createdAt:iso,
        createdBy:S.currentUser.name||S.currentUser.email||'unknown',
        passwordsIncluded:false,
        counts:{
          leads:(S.leads||[]).length,
          deals:(S.deals||[]).length,
          clients:(S.clients||[]).length,
          individualContacts:(S.individualContacts||[]).length,
          users:safeUsers.length,
          auditLog:(S.auditLog||[]).length,
          dealAuditLog:(S.dealAuditLog||[]).length,
          notes:(S.notes||[]).length,
          acts:(S.acts||[]).length
        }
      },
      leads:S.leads||[],
      deals:S.deals||[],
      clients:S.clients||[],
      individualContacts:S.individualContacts||[],
      users:safeUsers,
      auditLog:S.auditLog||[],
      dealAuditLog:S.dealAuditLog||[],
      notes:S.notes||[],
      activities:S.acts||[]
    };
    try {
      var json=JSON.stringify(payload,null,2);
      var blob=new Blob([json],{type:'application/json'});
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url;
      a.download='aa-crm-backup-'+ymd+'.json';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);},100);
      // Persist last-backup metadata
      S.lastBackupAt=iso;
      S.lastBackupBy=payload._meta.createdBy;
      try{localStorage.setItem('aa_crm_last_backup',JSON.stringify({at:iso,by:S.lastBackupBy}));}catch(_){}
      var sizeMb=(blob.size/1048576).toFixed(2);
      flash('Backup downloaded ('+sizeMb+' MB). Store it somewhere safe.');
      render();
    } catch(err){
      flash('Backup failed: '+err.message,'err');
    }
  });

  var cpBtn=document.getElementById('cp-save');
  if(cpBtn) cpBtn.addEventListener('click',function(){
    var cur=(document.getElementById('cp-current')||{}).value||'';
    var nw=(document.getElementById('cp-new')||{}).value||'';
    var conf=(document.getElementById('cp-confirm')||{}).value||'';
    S.changePassError='';S.changePassSuccess='';
    if(!cur||!nw||!conf){S.changePassError='Please fill in all fields.';render();return;}
    if(nw!==conf){S.changePassError='New passwords do not match.';render();return;}
    if(nw.length<6){S.changePassError='Password must be at least 6 characters.';render();return;}
    hashPassword(cur).then(function(curHash){
      if(curHash!==S.currentUser.password){S.changePassError='Current password is incorrect.';render();return;}
      hashPassword(nw).then(function(newHash){
        var updated=Object.assign({},S.currentUser,{password:newHash});
        saveUser(updated);S.currentUser=updated;
        S.users=S.users.map(function(u){return u.id===updated.id?updated:u;});
        sessionStorage.setItem('aa_crm_user',JSON.stringify(updated));
        S.changePassSuccess='Password updated successfully!';S.showChangePassword=false;render();
      });
    });
  });
  var addUserBtn=document.getElementById('add-user-btn');
  if(addUserBtn) addUserBtn.addEventListener('click',function(){S.showAddUser=!S.showAddUser;S.addUserError='';render();});
  var nuCancel=document.getElementById('nu-cancel');
  if(nuCancel) nuCancel.addEventListener('click',function(){S.showAddUser=false;render();});
  var nuSave=document.getElementById('nu-save');
  if(nuSave) nuSave.addEventListener('click',function(){
    var name=(document.getElementById('nu-name')||{}).value||'';
    var email=(document.getElementById('nu-email')||{}).value||'';
    var pass=(document.getElementById('nu-pass')||{}).value||'';
    var role=(document.getElementById('nu-role')||{}).value||'staff';
    S.addUserError='';
    if(!name.trim()||!email.trim()||!pass.trim()){S.addUserError='All fields are required.';render();return;}
    if(pass.length<6){S.addUserError='Password must be at least 6 characters.';render();return;}
    if(S.users.some(function(u){return u.email.toLowerCase()===email.trim().toLowerCase();})){S.addUserError='A user with this email already exists.';render();return;}
    var dept=(document.getElementById('nu-dept')||{}).value||'';
    var invited=!!S.nuSendInvite;
    hashPassword(pass).then(function(hash){
      var newUser={
        id:'USR'+Date.now(),
        name:name.trim(),
        email:email.trim().toLowerCase(),
        password:hash,
        role:role,
        department:dept.trim(),
        active:true,
        invited:invited,
        status:invited?'Invited':'Active',
        created_at:new Date().toISOString()
      };
      S.users=S.users.concat([newUser]);
      createUser(newUser);
      S.showAddUser=false;
      S.nuSendInvite=false;S.nuDept='';
      flash(invited?'User '+name+' added and marked as invited.':'User '+name+' created!');
      render();
    });
  });
  document.querySelectorAll('.role-sel').forEach(function(el){
    el.addEventListener('change',function(){
      var uid=el.dataset.uid,role=el.value;
      S.users=S.users.map(function(u){
        if(u.id!==uid) return u;
        var updated=Object.assign({},u,{role:role});saveUser(updated);
        if(S.currentUser.id===uid){S.currentUser=updated;sessionStorage.setItem('aa_crm_user',JSON.stringify(updated));}
        return updated;
      });render();
    });
  });
  document.querySelectorAll('.toggle-user-btn').forEach(function(el){
    el.addEventListener('click',function(){
      var uid=el.dataset.uid,active=el.dataset.active!=='1';
      S.users=S.users.map(function(u){if(u.id!==uid) return u;var updated=Object.assign({},u,{active:active,status:active?'Active':'Deactivated'});saveUser(updated);return updated;});
      S.usersActionMenu=null;
      flash(active?'User activated.':'User deactivated.');render();
    });
  });
  document.querySelectorAll('.reset-pass-btn').forEach(function(el){
    el.addEventListener('click',function(){
      var uid=el.dataset.uid,name=el.dataset.name;
      var newPass=prompt('Enter new temporary password for '+name+':');
      if(!newPass||newPass.length<6){alert('Password must be at least 6 characters.');return;}
      hashPassword(newPass).then(function(hash){
        S.users=S.users.map(function(u){if(u.id!==uid) return u;var updated=Object.assign({},u,{password:hash,passwordChangedAt:new Date().toISOString()});saveUser(updated);return updated;});
        S.usersActionMenu=null;
        flash('Password reset for '+name+'!');render();
      });
    });
  });
  document.querySelectorAll('.del-user-btn').forEach(function(el){
    el.addEventListener('click',function(){
      if(!confirm('Delete this user? This cannot be undone.')) return;
      var uid=el.dataset.uid;
      S.users=S.users.filter(function(u){return u.id!==uid;});
      deleteUserSB(uid);
      S.usersActionMenu=null;
      flash('User deleted.','err');render();
    });
  });
  // Deal file downloads
  document.querySelectorAll('.dl-file').forEach(function(el){
    el.addEventListener('click',function(ev){
      ev.stopPropagation();
      var d=S.deals.filter(function(x){return x._id===el.dataset.did;})[0];
      if(d&&d.files) downloadFile(d.files[parseInt(el.dataset.fi)]);
    });
  });
  document.querySelectorAll('.dl-lfile').forEach(function(el){
    el.addEventListener('click',function(){
      var l=S.leads.filter(function(x){return x._id===el.dataset.lid;})[0];
      if(l&&l.files) downloadFile(l.files[parseInt(el.dataset.fi)]);
    });
  });
}

S.form=bDeal();S.lform=bLead();

// Service type picker — absolutely no escaping issues
window._pickSvc=function(el){
  var svc=el.getAttribute('data-svc');
  if(!S.form) S.form=bDeal();
  S.form=Object.assign({},S.form,{serviceType:svc||''});
  S.tab='form';
  try{ render(); } catch(err){ alert('Render error: '+err.message); }
  var ca=document.querySelector('.content-area');
  if(ca) ca.scrollTop=0;
};
S.form=bDeal();S.lform=bLead();
// Restore session
var _sess=sessionStorage.getItem('aa_crm_user');
if(_sess){try{S.currentUser=JSON.parse(_sess);resetAutoLogout();}catch(e){}}
// Restore last view so refresh keeps the user on the same page
if(S.currentUser){
  try{
    var _view=JSON.parse(sessionStorage.getItem('aa_crm_view')||'null');
    if(_view&&_view.tab){
      S.tab=_view.tab;
      if(_view.leadsView) S.leadsView=_view.leadsView;
      if(_view.contactsView) S.contactsView=_view.contactsView;
      if(_view.apqTab) S.apqTab=_view.apqTab;
      if(_view.pipeSavedView) S.pipeSavedView=_view.pipeSavedView;
      if(_view.leadSavedView) S.leadSavedView=_view.leadSavedView;
      if(S.tab==='form'){S.tab='pipeline';}
    }
  }catch(e){}
}
render();
loadFromSupabase();
</script>
</body>
</html>
