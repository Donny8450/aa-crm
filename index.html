var SB_HEADERS = {
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=minimal'
};

var SB_SYNCING = false;
var SB_CONNECTED = false;
var SB_ERROR = '';

function sbReq(method, table, body, query){
  var url = SB_URL + '/rest/v1/' + table + (query||'');
  var opts = {method:method, headers:Object.assign({},SB_HEADERS)};
  if(body) opts.body = JSON.stringify(body);
  if(method==='POST') opts.headers['Prefer'] = 'resolution=merge-duplicates,return=minimal';
  return fetch(url, opts);
}

function sbUpsert(table, id, data){
  return sbReq('POST', table, {id:id, data:data});
}

function sbDelete(table, id){
  return sbReq('DELETE', table, null, '?id=eq.'+id);
}

function sbLoad(table){
  return sbReq('GET', table, null, '?select=id,data&order=created_at.asc')
    .then(function(r){return r.json();});
}

function loadFromSupabase(){
  S.SB_LOADING = true;
  render();
  Promise.all([
    sbLoad('deals'),
    sbLoad('leads'),
    sbLoad('notes'),
    sbLoad('activities'),
    sbLoad('audit_log')
  ]).then(function(results){
    var deals=results[0], leads=results[1], notes=results[2], acts=results[3], audit=results[4];
    if(Array.isArray(deals)) S.deals = deals.map(function(r){return Object.assign({_id:r.id},r.data);});
    if(Array.isArray(leads)) S.leads = leads.map(function(r){return Object.assign({_id:r.id},r.data);});
    if(Array.isArray(notes)) S.notes = notes.map(function(r){return Object.assign({_id:r.id},r.data);});
    if(Array.isArray(acts)) S.acts = acts.map(function(r){return Object.assign({_id:r.id},r.data);});
    if(Array.isArray(audit)) S.auditLog = audit.map(function(r){return Object.assign({_id:r.id},r.data);});
    SB_CONNECTED = true; SB_ERROR = '';
    S.SB_LOADING = false;
    render();
  }).catch(function(err){
    SB_CONNECTED = false; SB_ERROR = 'Could not connect to database.';
    S.SB_LOADING = false;
    render();
  });
}

function syncDeal(deal){
  sbUpsert('deals', deal._id, deal).catch(function(){flash('Sync error — check connection.','err');});
}
function syncLead(lead){
  sbUpsert('leads', lead._id, lead).catch(function(){flash('Sync error — check connection.','err');});
}
function syncNote(note){
  sbUpsert('notes', note._id, note).catch(function(){flash('Sync error.','err');});
}
function syncAct(act){
  sbUpsert('activities', act._id, act).catch(function(){flash('Sync error.','err');});
}
function syncAudit(entry){
  sbUpsert('audit_log', String(entry._id), entry).catch(function(){});
}
function deleteDeal(id){sbDelete('deals', id);}
function deleteLead(id){sbDelete('leads', id);}

  var lf=S.lform||bLead(),f1=document.getElementById('lf1'),f2=document.getElementById('af');

function persistDeal(status,msg){
  S.form=gDF();var f=S.form;
  f.dealStatus=status;
  if(S.eid!==null){
    var existing=S.deals.filter(function(x){return x._id===S.eid;})[0]||{};
    var updated=Object.assign({},existing,f,{_id:S.eid,files:(existing.files||[]).concat(S.dfiles),deliverables:existing.deliverables||[]});
    S.deals=S.deals.map(function(x){return x._id===S.eid?updated:x;});
    syncDeal(updated);
    flash(msg);S.eid=null;
  } else {
    var nid=fid('D',S.did++);
    var newDeal=Object.assign({},f,{_id:'D'+Date.now(),dealId:nid,files:S.dfiles,deliverables:[]});
    S.deals=S.deals.concat([newDeal]);
    syncDeal(newDeal);
    flash(msg+' ID: '+nid);
  }
  S.form=bDeal();S.dfiles=[];S.tab='pipeline';render();
}

function subDeal(){

function mvStage(){
  S.form=gDF();var f=S.form;
  var idx=STGS.indexOf(f.stage);
  var found=S.eid!==null?S.deals.filter(function(x){return x._id===S.eid;})[0]:null;
  var existing=found?(found.files||[]):[];
  var all=existing.concat(S.dfiles);
  if(idx>0&&all.length===0){flash('Upload at least one file before moving past Stage 0.','err');return;}
  if(S.eid!==null){S.deals=S.deals.map(function(x){return x._id===S.eid?Object.assign({},x,{currentStage:f.stage,files:all}):x;});}
  S.form=Object.assign({},S.form,{currentStage:f.stage});
  flash('Moved to '+f.stage);render();
}

function persistLead(lf, status, msg){
  var ts=new Date().toLocaleString();
  lf.leadStatus=status;
  if(S.leid!==null){
    var old=S.leads.filter(function(x){return x._id===S.leid;})[0]||{};
    var tracked=Object.assign({},lf,{bizStructure:S.biz});
    var changed=Object.keys(FL).filter(function(k){return String(tracked[k]||'')!==String(old[k]||'');});
    var entries=changed.map(function(k){return {_id:Date.now()+Math.random(),leadId:lf.leadId||'n/a',user:S.auditUser,field:FL[k],prev:String(old[k]||'n/a'),next:String(tracked[k]||'n/a'),ts:ts};});
    if(entries.length>0){S.auditLog=S.auditLog.concat(entries);entries.forEach(function(en){syncAudit(en);});}
    var updated=Object.assign({},lf,{_id:S.leid,files:(old.files||[]).concat(S.lfiles),bizStructure:S.biz});
    S.leads=S.leads.map(function(x){return x._id===S.leid?updated:x;});
    syncLead(updated);
    flash(msg);S.leid=null;
  } else {
    var nid=fid('L',S.lid++);
    var newLead=Object.assign({},lf,{_id:'L'+Date.now(),leadId:nid,files:S.lfiles,bizStructure:S.biz});
    S.leads=S.leads.concat([newLead]);
    var auditEntry={_id:Date.now(),leadId:nid,user:S.auditUser,field:'n/a',prev:'n/a',next:status==='draft'?'Lead saved as draft':'Lead submitted',ts:ts};
    S.auditLog=S.auditLog.concat([auditEntry]);
    syncLead(newLead);
    syncAudit(auditEntry);
    flash(msg+' ID: '+nid);
  }
  S.lform=bLead();S.lfiles=[];S.biz='';render();
}

function saveLead(){
  var lf=gLF();
  var pct=lf.pctComplete||0;lf.label=pct<=35?'Cold':pct<=65?'Warm':'Hot';
  if(lf.startDate&&lf.endDate&&lf.endDate<lf.startDate){flash('End date cannot be before start date.','err');return;}
  persistLead(lf,'draft',S.leid!==null?'Draft updated!':'Draft saved!');
}

function subLead(){
  var lf=gLF();
  var pct=lf.pctComplete||0;lf.label=pct<=35?'Cold':pct<=65?'Warm':'Hot';
  if(!lf.bizName||!lf.bizName.trim()){flash('Business Name is required.','err');return;}
  if(!lf.serviceType){flash('Service Type is required.','err');return;}
  if(!lf.ownerContact||!lf.ownerContact.trim()){flash('Owner / Main Contact is required.','err');return;}
  if(lf.startDate&&lf.endDate&&lf.endDate<lf.startDate){flash('End date cannot be before start date.','err');return;}
  var existing=S.leid!==null?S.leads.filter(function(x){return x._id===S.leid;})[0]:null;
  if(!existing||!existing.approved){
    flash('This lead must be approved by an authorised user before it can be submitted.','err');
    return;
  }
  persistLead(lf,'submitted',S.leid!==null?'Lead updated!':'Lead submitted!');
}

function cvt(id){
  var l=S.leads.filter(function(x){return x._id===id;})[0];if(!l) return;
  if(!l.approved){flash('This lead must be approved by an authorised user before it can be converted to a deal.','err');return;}
  var r=l.bizStructure==='limited'?2:1;
  if(!l.bizStructure){flash('Select a business structure first.','err');return;}
  if((l.files||[]).length<r){flash('Need '+r+' document'+(r>1?'s':'')+' to convert.','err');return;}
  var nid=fid('D',S.did++);
  var newDeal2=Object.assign({},bDeal(),{_id:'D'+Date.now(),dealId:nid,bizName:l.bizName||l.ownerContact||'',serviceType:l.serviceType||'',owner:l.ownerContact||'',email:l.email||'',phone:l.phone||'',source:l.source||'',projectBrief:l.projectBrief||'',startDate:l.startDate||'',endDate:l.endDate||'',status:'Active',files:l.files||[],deliverables:[]});
  S.deals=S.deals.concat([newDeal2]);
  syncDeal(newDeal2);
  var convertedLead=Object.assign({},l,{converted:true});
  S.leads=S.leads.map(function(x){return x._id===id?convertedLead:x;});
  syncLead(convertedLead);
  flash('"'+l.contactPerson+'" is now a Pipeline deal!');
  setTimeout(function(){S.tab='pipeline';render();},1200);render();
}

function dcsv(rows,fn){
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v||'').replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=fn;a.click();
}

function bind(){
  // tabs
  document.querySelectorAll('[data-tab]').forEach(function(el){
    el.addEventListener('click',function(){S.tab=el.dataset.tab;if(S.tab==='form'&&S.eid===null){S.form=bDeal();S.dfiles=[];}render();});
  });
  document.querySelectorAll('[data-goto]').forEach(function(el){
    el.addEventListener('click',function(){S.tab=el.dataset.goto;render();});
  });
  document.querySelectorAll('[data-ls]').forEach(function(el){
    el.addEventListener('click',function(){S.lsub=el.dataset.ls;render();});
  });
  // dash search
  var ds=document.getElementById('ds');
  if(ds) ds.addEventListener('input',function(){S.dsrch=ds.value;render();});
  // sections
  document.querySelectorAll('[data-sec]').forEach(function(el){
    el.addEventListener('click',function(){var k=el.dataset.sec;S.sec[k]=!S.sec[k];render();});
  });
  // deal form
  var df=document.getElementById('df');
  if(df) df.addEventListener('submit',function(e){e.preventDefault();subDeal();});
  var mvs=document.getElementById('mvs');if(mvs) mvs.addEventListener('click',mvStage);
  var sdv=document.getElementById('sdv');if(sdv) sdv.addEventListener('click',saveDeal);
  var sbd=document.getElementById('sbd');if(sbd) sbd.addEventListener('click',subDeal);
  var dcl=document.getElementById('dcl');if(dcl) dcl.addEventListener('click',function(){S.tab='pipeline';S.eid=null;S.form=bDeal();S.dfiles=[];render();});
  var dcan=document.getElementById('dcan');if(dcan) dcan.addEventListener('click',function(){S.eid=null;S.form=bDeal();S.dfiles=[];render();});
  var dfi=document.getElementById('dfi');
  if(dfi) dfi.addEventListener('change',function(){
    S.dfiles=S.dfiles.concat(Array.from(dfi.files).map(function(f){return {name:f.name,size:f.size};}));
    dfi.value='';var l=document.getElementById('dfl');if(l) l.innerHTML=rFL(S.dfiles,'d');bRF();
  });
  // pipeline
  document.querySelectorAll('[data-fs]').forEach(function(el){el.addEventListener('click',function(){S.fstat=el.dataset.fs;render();});});
  var psr=document.getElementById('psr');if(psr) psr.addEventListener('input',function(){S.srch=psr.value;render();});
  document.querySelectorAll('.edl').forEach(function(el){
    el.addEventListener('click',function(ev){ev.stopPropagation();var d=S.deals.filter(function(x){return x._id===el.dataset.id;})[0];if(d){S.form=Object.assign({},bDeal(),d);S.eid=d._id;S.dfiles=d.files||[];S.tab='form';render();}});
  });
  document.querySelectorAll('.dld').forEach(function(el){
    el.addEventListener('click',function(ev){ev.stopPropagation();var id=el.dataset.id;S.deals=S.deals.filter(function(x){return x._id!==id;});deleteDeal(id);flash('Deal removed.','err');render();});
  });
  document.querySelectorAll('.dr').forEach(function(el){
    el.addEventListener('click',function(){S.expId=S.expId===el.dataset.id?null:el.dataset.id;render();});
  });
  var exd=document.getElementById('exd');if(exd) exd.addEventListener('click',function(){
    if(!S.deals.length){flash('No deals.','err');return;}
    dcsv([['Deal ID','Business Name','Service Type','Status','Owner','Email','Phone','Source','Start Date','End Date','Project Brief','Deliverables Count','Avg Progress']].concat(S.deals.map(function(d){var dlvs=d.deliverables||[];var avg=dlvs.length?Math.round(dlvs.reduce(function(a,x){return a+(x.progress||0);},0)/dlvs.length):0;return [d.dealId||'',d.bizName||'',d.serviceType||'',d.status||'',d.owner||'',d.email||'',d.phone||'',d.source||'',d.startDate||'',d.endDate||'',d.projectBrief||'',dlvs.length,avg+'%'];})),'AA_Pipeline.csv');flash('Exported!');
  });
  // lead form
  document.querySelectorAll('.lbtn').forEach(function(el){el.addEventListener('click',function(){S.lform=Object.assign({},gLF(),{label:el.dataset.lbl});render();});});
  // Priority buttons
  document.querySelectorAll('.prbtn').forEach(function(el){el.addEventListener('click',function(){S.lform=Object.assign({},gLF(),{priority:el.dataset.v});render();});});
  // Percentage slider - live update label without full re-render
  var pslider=document.getElementById('pct-slider');
  if(pslider){
    pslider.addEventListener('input',function(){
      var pct=parseInt(pslider.value)||0;
      var lbl=document.getElementById('pct-lbl');
      if(lbl){
        var name=pct<=35?'Cold':pct<=65?'Warm':'Hot';
        var bg=pct<=35?'background:#eff6ff;color:#2563eb':pct<=65?'background:#FDF8EE;color:#C8972A':'background:#E8F5EE;color:#2D6A4F';
        lbl.setAttribute('style','padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;'+bg);
        lbl.innerHTML=pct+'% &mdash; '+name;
      }
      S.lform=Object.assign({},gLF(),{pctComplete:pct});
    });
  }
  // Date validation
  var edEl=document.getElementById('endDate');
  if(edEl){
    edEl.addEventListener('change',function(){
      var lf2=gLF();
      var errEl=document.getElementById('date-err');
      if(errEl){errEl.style.display=(lf2.startDate&&edEl.value&&edEl.value<lf2.startDate)?'block':'none';}
    });
  }
  document.querySelectorAll('.kbtn').forEach(function(el){el.addEventListener('click',function(){S.lform=Object.assign({},gLF(),{kickoffMeeting:el.dataset.v});render();});});
  document.querySelectorAll('.mbtn').forEach(function(el){el.addEventListener('click',function(){S.lform=Object.assign({},gLF(),{maSigned:el.dataset.v});render();});});
  document.querySelectorAll('.bsbtn').forEach(function(el){el.addEventListener('click',function(){S.biz=el.dataset.v;S.lfiles=[];render();});});
  var lfi=document.getElementById('lfi');
  if(lfi) lfi.addEventListener('change',function(){
    S.lfiles=S.lfiles.concat(Array.from(lfi.files).map(function(f){return {name:f.name,size:f.size};}));
    lfi.value='';var l=document.getElementById('lfl');if(l) l.innerHTML=rFL(S.lfiles,'l');bRF();
  });
  var svd=document.getElementById('svd');if(svd) svd.addEventListener('click',saveLead);
  var slb=document.getElementById('slb');if(slb) slb.addEventListener('click',subLead);
  var clb=document.getElementById('clb');if(clb) clb.addEventListener('click',function(){S.leid=null;S.lform=bLead();S.lfiles=[];S.biz='';render();});
  // lead table
  document.querySelectorAll('[data-fl]').forEach(function(el){el.addEventListener('click',function(){S.flbl=el.dataset.fl;render();});});
  var lsr=document.getElementById('lsr');if(lsr) lsr.addEventListener('input',function(){S.lsrch=lsr.value;render();});
  document.querySelectorAll('.ell').forEach(function(el){
    el.addEventListener('click',function(){
      var l=S.leads.filter(function(x){return x._id===el.dataset.id;})[0];
      if(l){
        S.auditLog=S.auditLog.concat([{_id:Date.now(),leadId:l.leadId||'n/a',user:S.auditUser,field:'n/a',prev:'n/a',next:'Opened for editing',ts:new Date().toLocaleString()}]);
        S.lform=Object.assign({},l);S.leid=l._id;S.lfiles=l.files||[];S.biz=l.bizStructure||'';render();
      }
    });
  });
  document.querySelectorAll('.dll').forEach(function(el){el.addEventListener('click',function(){var id=el.dataset.id;S.leads=S.leads.filter(function(x){return x._id!==id;});deleteLead(id);flash('Lead removed.','err');render();});});
  document.querySelectorAll('.cnv').forEach(function(el){el.addEventListener('click',function(){cvt(el.dataset.id);});});
  document.querySelectorAll('.aprbtn').forEach(function(el){el.addEventListener('click',function(){openApprovalModal(el.dataset.id,'approve');});});
  var aprCancel=document.getElementById('apr-cancel');if(aprCancel) aprCancel.addEventListener('click',closeApprovalModal);
  var aprConfirm=document.getElementById('apr-confirm');if(aprConfirm) aprConfirm.addEventListener('click',confirmApproval);
  var aprPass=document.getElementById('apr-pass');if(aprPass) aprPass.addEventListener('keydown',function(ev){if(ev.key==='Enter') confirmApproval();});
  var aprUser=document.getElementById('apr-user');if(aprUser) aprUser.addEventListener('keydown',function(ev){if(ev.key==='Enter'){var p=document.getElementById('apr-pass');if(p) p.focus();}});
  var exl=document.getElementById('exl');if(exl) exl.addEventListener('click',function(){
    if(!S.leads.length){flash('No leads.','err');return;}
    dcsv([['Lead ID','Business Name','Service Type','Owner/Contact','Phone','Email','Source','Priority','Start Date','End Date','% Complete','Label','Project Brief','Structure','Kickoff','MA Signed']].concat(S.leads.map(function(l){return [l.leadId||'',l.bizName||'',l.serviceType||'',l.ownerContact||'',l.phone||'',l.email||'',l.source||'',l.priority||'',(l.startDate||''),(l.endDate||''),(l.pctComplete||0)+'%',l.label,l.projectBrief||'',l.bizStructure||'',l.kickoffMeeting||'',l.maSigned||''];})),'AA_Leads.csv');flash('Exported!');
  });
  // audit
  var au=document.getElementById('au');if(au) au.addEventListener('input',function(){S.auditUser=au.value;});
  var cla=document.getElementById('cla');if(cla) cla.addEventListener('click',function(){S.auditLog=[];render();});
  document.querySelectorAll('.dau').forEach(function(el){el.addEventListener('click',function(){S.auditLog=S.auditLog.filter(function(x){return String(x._id)!==el.dataset.id;});render();});});
  // notes
  var sn=document.getElementById('sn');if(sn) sn.addEventListener('click',function(){
    var t=(document.getElementById('nt')||{}).value;if(!t||!t.trim()){flash('Note empty.','err');return;}
    var lid=(document.getElementById('nl')||{}).value;
    var lead=S.leads.filter(function(l){return l._id===lid;})[0];
    var newNote={_id:'N'+S.nid++,leadName:lead?lead.contactPerson+(lead.organization?' — '+lead.organization:''):null,text:t,date:new Date().toLocaleString()};
    S.notes=S.notes.concat([newNote]);
    syncNote(newNote);
    flash('Note saved!');render();
  });
  document.querySelectorAll('.dno').forEach(function(el){el.addEventListener('click',function(){var id=el.dataset.id;S.notes=S.notes.filter(function(x){return x._id!==id;});deleteNote(id);render();});});
  // activities
  var saa=document.getElementById('sa');if(saa) saa.addEventListener('click',function(){
    var lid=(document.getElementById('ald')||{}).value;
    var type=(document.getElementById('aty')||{}).value||'';
    var note=(document.getElementById('ano')||{}).value||'';
    var lead=S.leads.filter(function(l){return l._id===lid;})[0];
    var newAct={_id:'A'+S.aid++,leadName:lead?lead.contactPerson:null,type:type,note:note,date:new Date().toLocaleString(),done:false};
    S.acts=S.acts.concat([newAct]);
    syncAct(newAct);
    flash('Activity saved!');render();
  });
  document.querySelectorAll('.tdn').forEach(function(el){el.addEventListener('click',function(){var id=el.dataset.id;S.acts=S.acts.map(function(x){if(x._id!==id) return x;var u=Object.assign({},x,{done:!x.done});syncAct(u);return u;});render();});});
  document.querySelectorAll('.dac').forEach(function(el){el.addEventListener('click',function(){var id=el.dataset.id;S.acts=S.acts.filter(function(x){return x._id!==id;});deleteAct(id);render();});});
  // email
  var eml=document.getElementById('eml');if(eml) eml.addEventListener('change',function(){var l=S.leads.filter(function(x){return x._id===eml.value;})[0];var et=document.getElementById('eto');if(et&&l) et.value=l.email||'';});
  var soo=document.getElementById('soo');if(soo) soo.addEventListener('click',function(){var to=(document.getElementById('eto')||{}).value,sub=(document.getElementById('esb')||{}).value,body=(document.getElementById('ebo')||{}).value;if(!to){flash('No email.','err');return;}window.open('https://outlook.office.com/mail/deeplink/compose?to='+encodeURIComponent(to)+'&subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body),'_blank');});
  var smo=document.getElementById('smo');if(smo) smo.addEventListener('click',function(){var to=(document.getElementById('eto')||{}).value,sub=(document.getElementById('esb')||{}).value,body=(document.getElementById('ebo')||{}).value;if(!to){flash('No email.','err');return;}window.location.href='mailto:'+to+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body);});
  bRF();
}

function bRF(){
  document.querySelectorAll('.rfl').forEach(function(el){
    el.addEventListener('click',function(){
      var i=parseInt(el.dataset.i),p=el.dataset.p;
      if(p==='d'){S.dfiles=S.dfiles.filter(function(_,j){return j!==i;});var l=document.getElementById('dfl');if(l) l.innerHTML=rFL(S.dfiles,'d');}
      else{S.lfiles=S.lfiles.filter(function(_,j){return j!==i;});var l2=document.getElementById('lfl');if(l2) l2.innerHTML=rFL(S.lfiles,'l');}
      bRF();
    });
  });
}

S.form=bDeal();S.lform=bLead();
render();
loadFromSupabase();
</script>
</body>
</html>
